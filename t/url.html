<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<script src="../site.js"></script>
<script src="../theme.js"></script>
</head>
<body data-tool="url">

<main class="stack-6">
      <section>
        <label class="lbl" for="in">text or url</label>
        <textarea class="field" id="in" spellcheck="false"></textarea>
        <label class="check mt-2"><input type="checkbox" id="form"><span>form encoding (+ for spaces)</span></label>
        <div class="row mt-2">
          <button class="btn" id="parse" type="button">parse</button>
          <button class="btn -ghost" id="enc" type="button">encode</button>
          <button class="btn -ghost" id="dec" type="button">decode</button>
        </div>
        <p class="err" id="err" role="alert"></p>
      </section>

      <section>
        <div class="out" id="out" aria-live="polite"></div>
        <button class="btn -ghost mt-2" id="copy" type="button" disabled>copy</button>
      </section>
    </main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
      E.tool(function () {
        "use strict";

        /* ── core ────────────────────────────────────────────────────
           Pure: no DOM and no E. The site's MCP server (mcp-server.mjs)
           runs this block on its own, so an agent that never opens the page
           gets the same answers. AGENT_TOOLS is what both offer. */

        /** An absolute URL's parts, its query parameters decoded. */
        function parseUrl(value) {
          var url;
          try { url = new URL(value); } catch (e) { throw new Error("enter an absolute url, including https://"); }
          var parameters = [];
          url.searchParams.forEach(function (v, k) { parameters.push({ name: k, value: v }); });
          return {
            scheme: url.protocol.slice(0, -1), username: url.username, password: url.password,
            host: url.hostname, port: url.port, path: url.pathname, query: url.search, fragment: url.hash,
            parameters: parameters
          };
        }
        function percentEncode(value, formEncoding) {
          try {
            return formEncoding ? new URLSearchParams([["value", value]]).toString().slice(6) : encodeURIComponent(value);
          } catch (e) { throw new Error("text contains an invalid unicode character"); }
        }
        function percentDecode(value, formEncoding) {
          try { return decodeURIComponent(formEncoding ? value.replace(/\+/g, " ") : value); }
          catch (e) { throw new Error("invalid percent encoding"); }
        }
        function text(value) { return String(value == null ? "" : value); }

        var AGENT_TOOLS = [{
          name: "parse_url",
          title: "take a url apart",
          description: "Split an absolute URL into scheme, user, host, port, path, query, fragment and decoded query parameters.",
          input: { type: "object", properties: { url: { type: "string", description: "An absolute URL, scheme included." } }, required: ["url"] },
          readOnly: true,
          compute: function (args) { return parseUrl(text(args.url)); }
        }, {
          name: "percent_encode",
          title: "percent-encode text for a url",
          description: "Percent-encode text so it can sit in a URL path segment or query value. With form " +
            "encoding, spaces become + as in submitted forms.",
          input: {
            type: "object",
            properties: { text: { type: "string" }, formEncoding: { type: "boolean", default: false } },
            required: ["text"]
          },
          readOnly: true,
          compute: function (args) { return { encoded: percentEncode(text(args.text), !!args.formEncoding) }; }
        }, {
          name: "percent_decode",
          title: "decode percent-encoded text",
          description: "Decode percent-encoded text from a URL. With form encoding, + is read as a space.",
          input: {
            type: "object",
            properties: { text: { type: "string" }, formEncoding: { type: "boolean", default: false } },
            required: ["text"]
          },
          readOnly: true,
          compute: function (args) { return { decoded: percentDecode(text(args.text), !!args.formEncoding) }; }
        }];

        /* ── end core ──────────────────────────────────────────────── */

        var input = E.qs("#in");
        var output = E.qs("#out");
        var error = E.qs("#err");
        var copy = E.qs("#copy"), form = E.qs("#form"), mode = "parse";

        function clearOutput() {
          output.textContent = "";
          copy.disabled = true;
        }

        function put(value) {
          output.textContent = value;
          error.textContent = "";
          copy.disabled = !value;
        }

        function run() {
          clearOutput();
          error.textContent = "";
          if (!input.value) return;
          try {
            if (mode === "enc") { put(percentEncode(input.value, form.checked)); return; }
            if (mode === "dec") { put(percentDecode(input.value, form.checked)); return; }
            var url = parseUrl(input.value);
            put([
              "scheme  " + url.scheme
            ].concat(url.username ? ["user    " + url.username + (url.password ? ":" + url.password : "")] : [], [
              "host    " + url.host
            ], url.port ? ["port    " + url.port] : [], [
              "path    " + url.path,
              "query   " + (url.query || "—"),
              "hash    " + (url.fragment || "—"),
              "",
              "parameters",
              url.parameters.map(function (p) { return p.name + " = " + p.value; }).join("\n") || "—"
            ]).join("\n"));
          } catch (e) {
            error.textContent = e.message;
          }
        }

        ["parse", "enc", "dec"].forEach(function (id) {
          var button = E.qs("#" + id);
          button.setAttribute("aria-pressed", id === mode ? "true" : "false");
          E.on(button, "click", function () {
            mode = id;
            ["parse", "enc", "dec"].forEach(function (other) {
              var action = E.qs("#" + other);
              action.classList.toggle("-ghost", other !== mode);
              action.setAttribute("aria-pressed", other === mode ? "true" : "false");
            });
            form.disabled = mode === "parse";
            run();
          });
        });

        form.disabled = true;
        E.on(input, "input", E.debounce(run, 120));
        E.on(form, "change", run);

        E.on(E.qs("#copy"), "click", function () {
          E.copy(output.textContent, this);
        });

        var query = E.param("t");
        if (query) {
          input.value = query;
          E.qs("#parse").click();
        }

        /* For agents in the browser: each tool presses the page's own button
           on the agent's text, so the visitor sees what was asked. */
        function press(id, value, formEncoding) {
          input.value = text(value);
          form.checked = !!formEncoding;
          E.qs("#" + id).click();
        }
        E.agentTools(AGENT_TOOLS, {
          parse_url: function (args) { press("parse", args.url); return AGENT_TOOLS[0].compute(args); },
          percent_encode: function (args) { press("enc", args.text, args.formEncoding); return AGENT_TOOLS[1].compute(args); },
          percent_decode: function (args) { press("dec", args.text, args.formEncoding); return AGENT_TOOLS[2].compute(args); }
        });
      });
</script>
</body>
</html>
