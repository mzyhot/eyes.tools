<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<style>
  /* one row per value, each with its own copy: no label column to fill */
  #out .res { grid-template-columns: minmax(0, 1fr) auto; }
</style>
<script src="../site.js"></script>
</head>
<body data-tool="pass">

<main class="stack-6">
      <section>
        <span class="lbl" id="kind-label">kind</span>
        <div class="seg" role="radiogroup" aria-labelledby="kind-label">
          <label><input type="radio" name="kind" value="password" checked><span>password</span></label>
          <label><input type="radio" name="kind" value="phrase"><span>passphrase</span></label>
          <label><input type="radio" name="kind" value="pin"><span>pin</span></label>
        </div>
      </section>

      <section class="grid2">
        <div>
          <label class="lbl" for="len" id="len-label">length</label>
          <input class="field" id="len" type="number" min="4" max="128" value="20"
                 inputmode="numeric" autocomplete="off">
        </div>
        <div>
          <label class="lbl" for="n">how many</label>
          <input class="field" id="n" type="number" min="1" max="100" value="5"
                 inputmode="numeric" autocomplete="off">
        </div>
      </section>

      <section>
        <div id="out" aria-live="polite"></div>
        <p class="err" id="err" role="alert"></p>
        <p class="hint" id="strength"></p>
        <div class="row mt-2">
          <button class="btn" id="again" type="button">regenerate</button>
          <button class="btn -ghost" id="copy" type="button" disabled>copy all</button>
        </div>
      </section>
    </main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
      E.tool(function () {
        "use strict";

        /* ── core ────────────────────────────────────────────────────
           Pure: no DOM and no E. The site's MCP server (mcp-server.mjs)
           runs this block on its own, so an agent that never opens the page
           gets the same answers. AGENT_TOOLS is what both offer. */

        var ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*-_=+";
        var WORDS = "amber anchor apple atlas birch black bloom brass brick cedar cloud coast coral crane dusk ember field flint frost glass grain grove harbor hazel ivory juniper lake linen maple moss night north oak ocean olive orbit paper pearl pine quartz rain reed river slate solar stone tide umber vale west willow wind".split(" ");
        var LENGTHS = { password: "20", phrase: "12", pin: "6" };

        /* One symbol, uniformly: bytes past the last whole multiple of the
           alphabet's size are drawn again rather than folded in. */
        function pick(alphabet) {
          var limit = 256 - (256 % alphabet.length), byte = new Uint8Array(1);
          do { crypto.getRandomValues(byte); } while (byte[0] >= limit);
          return alphabet[byte[0] % alphabet.length];
        }

        function whole(raw, min, max, label) {
          raw = String(raw == null ? "" : raw).trim();
          if (!/^[0-9]+$/.test(raw)) throw new Error(label + " must be a whole number");
          var value = Number(raw);
          if (!Number.isSafeInteger(value) || value < min || value > max) {
            throw new Error(label + " must be between " + min + " and " + max);
          }
          return value;
        }

        /**
         * A batch of secrets.
         * @param {"password"|"phrase"|"pin"} kind
         * @param {*} lengthRaw Characters, or words for a phrase, as typed.
         * @param {*} countRaw How many, as typed.
         * @returns {{values: string[], strength: string}}
         */
        function makeValues(kind, lengthRaw, countRaw) {
          var length = whole(lengthRaw, 4, 128, kind === "phrase" ? "word count" : "length");
          var count = whole(countRaw, 1, 100, "how many"), values = [];
          for (var index = 0; index < count; index += 1) {
            if (kind === "phrase") {
              var words = [];
              for (var word = 0; word < length; word += 1) words.push(pick(WORDS));
              values.push(words.join("-"));
            } else {
              var alphabet = kind === "pin" ? "0123456789" : ALPHABET;
              var value = "";
              for (var character = 0; character < length; character += 1) value += pick(alphabet);
              values.push(value);
            }
          }
          var choices = kind === "phrase" ? WORDS.length : kind === "pin" ? 10 : ALPHABET.length;
          return {
            values: values,
            strength: Math.floor(length * Math.log2(choices)) + " bits of randomness per value" +
              (kind === "phrase" ? " · " + WORDS.length + "-word list" : "")
          };
        }

        /* The agent's names for the kinds, and the page's. */
        var KINDS = { password: "password", passphrase: "phrase", pin: "pin" };
        var AGENT_TOOLS = [{
          name: "generate_passwords",
          title: "make passwords",
          description: "Make passwords (letters, digits and symbols, easily confused ones left out), " +
            "passphrases (hyphen-joined words) or numeric pins, from Web Crypto randomness. Returns the " +
            "values and their strength in bits.",
          input: {
            type: "object",
            properties: {
              kind: { type: "string", enum: ["password", "passphrase", "pin"], default: "password" },
              length: { type: "integer", minimum: 4, maximum: 128, description: "Characters, or words for a passphrase. 20, 12 and 6 when left out." },
              count: { type: "integer", minimum: 1, maximum: 100, default: 1 }
            }
          },
          readOnly: true,
          compute: function (args) {
            var kind = pageKind(args);
            return makeValues(kind, args.length == null ? LENGTHS[kind] : args.length, args.count == null ? 1 : args.count);
          }
        }];
        function pageKind(args) {
          var wanted = args.kind == null ? "password" : String(args.kind);
          if (!Object.prototype.hasOwnProperty.call(KINDS, wanted)) throw new Error("kind must be password, passphrase or pin");
          return KINDS[wanted];
        }

        /* ── end core ──────────────────────────────────────────────── */

        var output = E.qs("#out");
        var error = E.qs("#err");
        var copy = E.qs("#copy");
        var lengthInput = E.qs("#len"), lengthLabel = E.qs("#len-label"), strength = E.qs("#strength");
        var lengths = Object.assign({}, LENGTHS);
        var previousKind = "password", values = [];

        function kind() {
          var selected = E.qsa("input[name=kind]").filter(function (input) {
            return input.checked;
          })[0];
          return selected ? selected.value : "password";
        }

        function run() {
          output.textContent = "";
          error.textContent = "";
          copy.disabled = true;
          strength.textContent = "";
          values = [];

          try {
            var made = makeValues(kind(), E.qs("#len").value, E.qs("#n").value);
            values = made.values;
            values.forEach(function (value, index) {
              var button = E.el("button", { class: "tbtn", type: "button", text: "copy", "aria-label": "copy value " + (index + 1) });
              E.on(button, "click", function () { E.copy(value, button); });
              output.appendChild(E.el("div", { class: "res" }, [E.el("div", { class: "res__v", text: value }), button]));
            });
            copy.textContent = values.length > 1 ? "copy all" : "copy";
            copy.disabled = values.length === 0;
            strength.textContent = made.strength;
          } catch (generationError) {
            error.textContent = generationError && generationError.message
              ? generationError.message
              : "could not generate a value in this browser";
          }
        }
        E.qsa("input[name=kind]").forEach(function (input) {
          E.on(input, "change", function () {
            lengths[previousKind] = lengthInput.value;
            previousKind = kind();
            lengthInput.value = lengths[previousKind];
            lengthLabel.textContent = previousKind === "phrase" ? "words" : "length";
            run();
          });
        });
        E.on(E.qs("#len"), "input", run);
        E.on(E.qs("#n"), "input", run);
        E.on(E.qs("#again"), "click", run);
        E.on(copy, "click", function () { E.copy(values.join("\n"), this); });
        run();

        /* For agents in the browser: the values are made on the page, and the
           agent gets exactly the ones the visitor sees. */
        E.agentTools(AGENT_TOOLS, {
          generate_passwords: function (args) {
            var wanted = pageKind(args), radio = E.qs('input[name=kind][value="' + wanted + '"]');
            if (!radio.checked) { radio.checked = true; radio.dispatchEvent(new Event("change")); }
            if (args.length != null) lengthInput.value = String(args.length);
            E.qs("#n").value = String(args.count == null ? 1 : args.count);
            run();
            if (error.textContent) throw new Error(error.textContent);
            return { values: values.slice(), strength: strength.textContent };
          }
        });
      });
</script>
</body>
</html>
