<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<script src="../site.js"></script>
<script src="../theme.js"></script>
</head>
<body data-tool="dice">

<main class="stack-6">
  <section>
    <div class="seg" role="radiogroup" aria-label="randomness source">
      <label><input type="radio" name="src" value="prng"><span>prng</span></label>
      <label><input type="radio" name="src" value="trng"><span>trng</span></label>
      <label><input type="radio" name="src" value="csrng" checked><span>csrng</span></label>
    </div>
    <p class="hint" id="source-note" aria-live="polite"></p>
  </section>
  <section class="grid2">
    <div><label class="lbl" for="dice">dice</label><input class="field" id="dice" type="number" min="1" max="100" value="2" inputmode="numeric"></div>
    <div><label class="lbl" for="sides">sides</label><input class="field" id="sides" type="number" min="2" max="1000000" value="6" inputmode="numeric"></div>
  </section>
  <section>
    <button class="btn" id="roll" type="button">roll</button>
    <p class="err" id="err" role="alert"></p>
    <div class="display mt-4" id="total" aria-live="polite"></div>
    <div class="out mt-2" id="rolls" aria-live="polite"></div>
    <button class="btn -ghost mt-2" id="copy" type="button" disabled>copy results</button>
    <dl class="kv -stack mt-4" id="proof" hidden><dt>verification</dt><dd>signature verified</dd><dt>round</dt><dd id="round"></dd><dt>chain</dt><dd id="chain"></dd></dl>
  </section>
</main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
E.tool(function () {
  "use strict";
  var b = E.qs("#roll"), er = E.qs("#err"), totalEl = E.qs("#total"), rollsEl = E.qs("#rolls"), proof = E.qs("#proof");
  var copy = E.qs("#copy"), report = "", rollSeq = 0;
  /* The three sources rng offers, described the same way. */
  var NOTES = {
    prng: "Math.random() · predictable · not for security",
    trng: "fetches a public beacon from cloudflare drand and verifies its signature. your dice settings stay in this browser.",
    csrng: "web crypto api · suitable for secrets"
  };
  function mode() {
    var selected = E.qsa("input[name=src]").filter(function (x) { return x.checked; })[0];
    return selected ? selected.value : "csrng";
  }
  function whole(id, min, max, label) {
    var raw = E.qs(id).value.trim(), value = Number(raw);
    if (!/^\d+$/.test(raw) || !Number.isSafeInteger(value) || value < min || value > max) {
      throw new Error(label + " must be a whole number between " + min + " and " + max);
    }
    return value;
  }
  function clear() {
    er.textContent = "";
    report = "";
    copy.disabled = true;
    totalEl.textContent = "";
    rollsEl.textContent = "";
    proof.hidden = true;
    E.qs("#round").textContent = "";
    E.qs("#chain").textContent = "";
  }
  /* A new source starts afresh: a roll still on its way from drand is
     dropped rather than shown under a different source's name. */
  function note() {
    rollSeq++;
    E.qs("#source-note").textContent = NOTES[mode()];
    clear();
    b.disabled = false;
    delete b.dataset.state;
  }
  E.on(copy, "click", function () { E.copy(report, this); });
  /* Roll what the fields ask for, drawing the result on the page. Resolves to
     the roll, or rejects with the message the page shows. */
  function roll() {
    var n, s, seq = ++rollSeq, source = mode();
    clear();
    try {
      n = whole("#dice", 1, 100, "dice");
      s = whole("#sides", 2, 1000000, "sides");
    } catch (e) { er.textContent = e.message; return Promise.reject(e); }
    b.disabled = true;
    b.dataset.state = "loading";
    return R.source(source, R.byteCount(BigInt(s), n)).then(function (r) {
      if (seq !== rollSeq) throw new Error("a newer roll replaced this one");
      var vals = [], at = 0, total = 0;
      for (var i = 0; i < n; i++) {
        var x = R.uniform(r.bytes, BigInt(s), at);
        at = x.offset;
        var v = Number(x.value) + 1;
        vals.push(v);
        total += v;
      }
      totalEl.textContent = total;
      rollsEl.textContent = vals.join(" + ");
      report = n + "d" + s + ": " + vals.join(" + ") + " = " + total;
      copy.disabled = false;
      proof.hidden = !r.verified;
      if (r.verified) {
        E.qs("#round").textContent = r.round;
        E.qs("#chain").textContent = r.chainHash;
      }
      E.flash(b, "rolled");
      var result = { rolls: vals, total: total, source: source, verified: !!r.verified };
      if (r.verified) { result.round = r.round; result.chainHash = r.chainHash; }
      return result;
    }, function (e) {
      var message = (e && e.message) || "the randomness source failed";
      if (seq === rollSeq) er.textContent = message;
      throw new Error(message);
    }).finally(function () {
      if (seq !== rollSeq) return;
      b.disabled = false;
      delete b.dataset.state;
    });
  }
  E.qsa("input[name=src]").forEach(function (x) { E.on(x, "change", note); });
  E.on(b, "click", function () { roll().catch(function () {}); });
  note();

  /* For agents: a roll on the page, from the source the agent names. */
  E.agentTool({
    name: "roll_dice",
    title: "roll dice",
    description: "Roll up to 100 dice of 2 to 1,000,000 sides. The source is csrng (the browser's Web " +
      "Crypto; the default), trng (a public drand beacon whose signature the page verifies, so anyone " +
      "can check the round later; needs the network) or prng (Math.random, predictable). The roll is " +
      "shown on the page.",
    input: {
      type: "object",
      properties: {
        dice: { type: "integer", minimum: 1, maximum: 100, default: 1 },
        sides: { type: "integer", minimum: 2, maximum: 1000000, default: 6 },
        source: { type: "string", enum: ["csrng", "trng", "prng"], default: "csrng" }
      }
    },
    readOnly: true,
    run: function (args) {
      var source = args.source == null ? "csrng" : String(args.source);
      var radio = E.qs('input[name=src][value="' + source + '"]');
      if (["csrng", "trng", "prng"].indexOf(source) < 0 || !radio) throw new Error("source must be csrng, trng or prng");
      radio.checked = true;
      note();
      E.qs("#dice").value = String(args.dice == null ? 1 : args.dice);
      E.qs("#sides").value = String(args.sides == null ? 6 : args.sides);
      return roll();
    }
  });
});
</script>
</body>
</html>
