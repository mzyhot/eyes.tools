<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<script src="../site.js"></script>
<script src="../theme.js"></script>
</head>
<body data-tool="lorem">

<main class="stack-6">
<section class="grid3">
  <div><label class="lbl" for="n">how many</label><input class="field" id="n" type="number" min="1" max="100" value="3" inputmode="numeric"></div>
  <div><label class="lbl" for="unit">unit</label><select class="field" id="unit"><option value="paragraphs">paragraphs</option><option value="sentences">sentences</option><option value="words">words</option></select></div>
  <div><label class="lbl" for="len">paragraph length</label><select class="field" id="len"><option value="short">short</option><option value="medium" selected>medium</option><option value="long">long</option></select></div>
</section>
<section>
  <p class="err" id="err" role="alert"></p>
  <div class="out out--scroll" id="out" aria-live="polite"></div>
  <div class="row mt-2"><button class="btn" id="copy" type="button">copy</button><button class="btn -ghost" id="dl" type="button">download txt</button></div>
</section>
</main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
E.tool(function () {
  "use strict";

  /* ── core ──────────────────────────────────────────────────────────
     Pure: no DOM and no E. The site's MCP server (mcp-server.mjs) runs this
     block on its own, so an agent that never opens the page gets the same
     answers. AGENT_TOOLS is what the page and the server both offer. */

  var sentences = [
    "Lorem ipsum dolor sit amet, consectetur adipiscing elit.",
    "Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.",
    "Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.",
    "Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.",
    "Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum."
  ];
  var UNITS = ["paragraphs", "sentences", "words"], LENGTHS = ["short", "medium", "long"];
  function most(kind) { return kind === "words" ? 10000 : kind === "sentences" ? 1000 : 100; }
  /**
   * Placeholder text.
   * @param {string} raw How many, as typed.
   * @param {"paragraphs"|"sentences"|"words"} kind
   * @param {"short"|"medium"|"long"} size Sentences per paragraph.
   * @returns {string}
   */
  function lorem(raw, kind, size) {
    var n = Number(raw), max = most(kind), parts = [], i;
    if (!/^\d+$/.test(raw) || !Number.isSafeInteger(n) || n < 1 || n > max) {
      throw new Error("enter a whole number from 1 to " + max.toLocaleString());
    }
    if (kind === "words") {
      var words = sentences.join(" ").split(/\s+/);
      for (i = 0; i < n; i++) parts.push(words[i % words.length]);
      return parts.join(" ").replace(/[,.]$/, "") + ".";
    }
    if (kind === "sentences") {
      for (i = 0; i < n; i++) parts.push(sentences[i % sentences.length]);
      return parts.join(" ");
    }
    /* Each paragraph starts one sentence further on, so no two neighbours
       read the same; the first still opens with "Lorem ipsum". */
    var count = size === "short" ? 2 : size === "long" ? 5 : 3;
    for (i = 0; i < n; i++) {
      var paragraph = [];
      for (var j = 0; j < count; j++) paragraph.push(sentences[(i + j) % sentences.length]);
      parts.push(paragraph.join(" "));
    }
    return parts.join("\n\n");
  }

  var AGENT_TOOLS = [{
    name: "generate_lorem_ipsum",
    title: "make placeholder text",
    description: "Make lorem ipsum placeholder text: a number of paragraphs (short, medium or long), sentences or words.",
    input: {
      type: "object",
      properties: {
        count: { type: "integer", minimum: 1, maximum: 10000, default: 3, description: "How many paragraphs, sentences or words; at most 100, 1,000 and 10,000." },
        unit: { type: "string", enum: UNITS, default: "paragraphs" },
        paragraphLength: { type: "string", enum: LENGTHS, default: "medium" }
      }
    },
    readOnly: true,
    compute: function (args) {
      var kind = args.unit == null ? "paragraphs" : String(args.unit), size = args.paragraphLength == null ? "medium" : String(args.paragraphLength);
      if (UNITS.indexOf(kind) < 0) throw new Error("unit must be paragraphs, sentences or words");
      if (LENGTHS.indexOf(size) < 0) throw new Error("paragraph length must be short, medium or long");
      return { text: lorem(String(args.count == null ? 3 : args.count), kind, size) };
    }
  }];

  /* ── end core ────────────────────────────────────────────────────── */

  var out = E.qs("#out"), quantity = E.qs("#n"), unit = E.qs("#unit"), length = E.qs("#len");
  function run() {
    var raw = quantity.value.trim(), kind = unit.value;
    quantity.max = most(kind);
    length.disabled = kind !== "paragraphs";
    out.textContent = "";
    E.qs("#err").textContent = "";
    E.qs("#copy").disabled = true;
    E.qs("#dl").disabled = true;
    if (!raw) return;
    try { out.textContent = lorem(raw, kind, length.value); }
    catch (e) { E.qs("#err").textContent = e.message; return; }
    E.qs("#copy").disabled = false;
    E.qs("#dl").disabled = false;
  }
  E.on(quantity, "input", run);
  E.on(unit, "change", run);
  E.on(length, "change", run);
  E.on(E.qs("#copy"), "click", function () { E.copy(out.textContent, this); });
  E.on(E.qs("#dl"), "click", function () { E.download(out.textContent, "lorem.txt", "text/plain;charset=utf-8"); E.flash(this, "downloaded"); });
  run();

  /* For agents in the browser: the core's tool, set in the page's own fields. */
  E.agentTools(AGENT_TOOLS, {
    generate_lorem_ipsum: function (args) {
      var result = AGENT_TOOLS[0].compute(args);
      unit.value = args.unit == null ? "paragraphs" : String(args.unit);
      length.value = args.paragraphLength == null ? "medium" : String(args.paragraphLength);
      quantity.value = String(args.count == null ? 3 : args.count);
      run();
      return result;
    }
  });
});
</script>
</body>
</html>
