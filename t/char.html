<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<script src="../site.js"></script>
<script src="../theme.js"></script>
</head>
<body data-tool="char">

<main class="stack-6">
      <section>
        <div class="seg" role="radiogroup" aria-label="character set">
          <label><input type="radio" name="mode" value="unicode" checked><span>unicode</span></label>
          <label><input type="radio" name="mode" value="ascii"><span>ascii</span></label>
        </div>
      </section>

      <section>
        <label class="lbl" for="q">glyph, decimal, u+ code, html entity, or ascii name</label>
        <input class="field" id="q" placeholder="𓁹 or U+13079 or 0x41 or LF"
               autocomplete="off" spellcheck="false">
        <p class="err" id="err" role="alert"></p>
      </section>

      <section>
        <div class="display" id="glyph" aria-live="polite"></div>
        <div class="row mt-3"><button class="btn -ghost" id="copy" type="button" disabled>copy character</button></div>
        <div class="mt-6" id="forms" aria-live="polite"></div>
      </section>
    </main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
      E.tool(function () {
        "use strict";

        var input = E.qs("#q");
        var glyph = E.qs("#glyph");
        var error = E.qs("#err");
        var copy = E.qs("#copy");
        var forms = E.qs("#forms");
        var character = "";
        var controlNames = [
          "NUL", "SOH", "STX", "ETX", "EOT", "ENQ", "ACK", "BEL",
          "BS", "HT", "LF", "VT", "FF", "CR", "SO", "SI",
          "DLE", "DC1", "DC2", "DC3", "DC4", "NAK", "SYN", "ETB",
          "CAN", "EM", "SUB", "ESC", "FS", "GS", "RS", "US"
        ];
        var named = { TAB: 9, NEWLINE: 10, RETURN: 13, SPACE: 32, DEL: 127 };
        controlNames.forEach(function (name, index) { named[name] = index; });

        function mode() {
          var selected = E.qsa("input[name=mode]").filter(function (radio) {
            return radio.checked;
          })[0];
          return selected ? selected.value : "unicode";
        }

        /* Every way to write the character down, one row each, each with its
           own copy button. */
        var FORMS = [
          ["decimal", "dec", function (cp) { return String(cp); }],
          ["code point", "hex", function (cp, hex) { return "U+" + hex.padStart(4, "0"); }],
          ["utf-8", "utf", function (cp, hex, ch) {
            return Array.from(new TextEncoder().encode(ch)).map(function (byte) { return byte.toString(16).padStart(2, "0"); }).join(" ");
          }],
          ["html", "html", function (cp) { return "&#" + cp + ";"; }],
          ["html hex", "html-hex", function (cp, hex) { return "&#x" + hex + ";"; }],
          ["javascript", "js", function (cp, hex) { return cp > 0xffff ? "\\u{" + hex + "}" : "\\u" + hex.padStart(4, "0"); }],
          ["css", "css", function (cp, hex) { return "\\" + hex; }],
          ["url", "url", function (cp, hex, ch) { return encodeURIComponent(ch); }]
        ];
        var rows = FORMS.map(function (form) {
          var v = E.el("div", { class: "res__v", id: form[1] });
          var b = E.el("button", { class: "tbtn", type: "button", text: "copy", "aria-label": "copy the " + form[0] + " form", disabled: true });
          E.on(b, "click", function () { E.copy(v.textContent, b); });
          forms.appendChild(E.el("div", { class: "res" }, [E.el("div", { class: "res__k", text: form[0] }), v, b]));
          return { fn: form[2], v: v, button: b };
        });

        /* A named html entity, decoded by the parser itself: text set on a
           detached textarea is never run or rendered, only unescaped. */
        var decoder = document.createElement("textarea");
        function entity(value) {
          decoder.innerHTML = value;
          var decoded = decoder.value;
          return decoded !== value && Array.from(decoded).length === 1 ? decoded.codePointAt(0) : null;
        }

        function clearReadout() {
          glyph.textContent = "—";
          rows.forEach(function (row) { row.v.textContent = ""; row.button.disabled = true; });
          character = "";
          copy.disabled = true;
        }

        function run() {
          var raw = input.value, value = raw.trim();
          var ascii = mode() === "ascii";
          var codePoint = null;
          error.textContent = "";
          clearReadout();

          if (!raw) return;
          if (!value && Array.from(raw).length === 1) value = raw;
          if (!value) return;
          var upper = value.toUpperCase();
          if (named[upper] != null) codePoint = named[upper];
          else if (/^U\+[0-9a-f]+$/i.test(value)) codePoint = parseInt(value.slice(2), 16);
          else if (/^0x[0-9a-f]+$/i.test(value)) codePoint = parseInt(value.slice(2), 16);
          else if (/^&#x[0-9a-f]+;$/i.test(value)) codePoint = parseInt(value.slice(3, -1), 16);
          else if (/^&#\d+;$/.test(value)) codePoint = parseInt(value.slice(2, -1), 10);
          else if (/^&[a-z][a-z0-9]*;$/i.test(value) && entity(value) !== null) codePoint = entity(value);
          else if (/^\d+$/.test(value)) codePoint = parseInt(value, 10);
          else if (Array.from(value).length === 1) codePoint = value.codePointAt(0);
          else {
            error.textContent = "enter one character, a code such as U+0041, or a known ascii name";
            return;
          }

          if (
            !Number.isInteger(codePoint) ||
            codePoint < 0 ||
            codePoint > 0x10ffff ||
            (codePoint >= 0xd800 && codePoint <= 0xdfff) ||
            (ascii && codePoint > 127)
          ) {
            error.textContent = ascii
              ? "value is outside ascii (0–127)"
              : "not a valid unicode scalar value";
            return;
          }

          character = String.fromCodePoint(codePoint);
          glyph.textContent = codePoint < 32 ? controlNames[codePoint] : codePoint === 127 ? "DEL" : /^\s$/u.test(character) ? (codePoint === 32 ? "space" : "whitespace") : character;
          var hex = codePoint.toString(16).toUpperCase();
          rows.forEach(function (row) { row.v.textContent = row.fn(codePoint, hex, character); row.button.disabled = false; });
          copy.disabled = false;
        }

        E.on(input, "input", run);
        E.qsa("input[name=mode]").forEach(function (radio) {
          E.on(radio, "change", run);
        });
        E.on(copy, "click", function () { E.copy(character, this); });
        input.value = E.param("t") || "";
        run();
      });
</script>
</body>
</html>
