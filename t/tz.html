<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<style>
      #result {
        font-size: clamp(var(--text-xl), 4vw, var(--text-2xl));
        line-height: var(--lh-snug);
        text-wrap: balance;
        margin-bottom: var(--space-6);
      }
    </style>
<script src="../site.js"></script>
</head>
<body data-tool="tz">

<main class="stack-6">
      <section>
        <label class="lbl" for="when">date and time</label>
        <input class="field" id="when" type="datetime-local">
      </section>

      <section class="grid2">
        <div>
          <label class="lbl" for="from">from</label>
          <input class="field" id="from" list="zones" value="UTC" autocomplete="off">
        </div>
        <div>
          <label class="lbl" for="to">to</label>
          <input class="field" id="to" list="zones" autocomplete="off">
        </div>
      </section>

      <datalist id="zones"></datalist>

      <section id="overlap" hidden>
        <label class="lbl" for="occurrence">which occurrence</label>
        <select class="field" id="occurrence" aria-describedby="occurrence-hint"><option value="earlier">first occurrence</option><option value="later">second occurrence</option></select>
        <p class="hint mt-2" id="occurrence-hint">this local time happens twice: the clock moves back in this zone. choose which instant you mean.</p>
      </section>

      <div class="row">
        <button class="btn" id="convert" type="button">convert</button>
        <button class="btn -ghost" id="swap" type="button">swap</button>
      </div>

      <p class="err" id="err" role="alert"></p>

      <section>
        <div class="display" id="result" aria-live="polite"></div>
        <dl class="kv -stack">
          <dt>source</dt>
          <dd id="source"></dd>
          <dt>destination</dt>
          <dd id="dest"></dd>
          <dt>instant</dt>
          <dd id="iso"></dd>
        </dl>
        <div class="row mt-4"><button class="btn -ghost" id="copy" type="button" disabled>copy</button></div>
      </section>
    </main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
      E.tool(function () {
        "use strict";

        /* ── core ────────────────────────────────────────────────────
           Pure: no DOM and no E. The site's MCP server (mcp-server.mjs)
           runs this block on its own, so an agent that never opens the page
           gets the same answers. AGENT_TOOLS is what both offer. */

        function pad(n) {
          return String(n).padStart(2, "0");
        }

        function partsAt(ms, zone) {
          var parts = new Intl.DateTimeFormat("en-CA", {
            timeZone: zone,
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23"
          }).formatToParts(new Date(ms));
          var out = {};
          parts.forEach(function (part) {
            if (part.type !== "literal") out[part.type] = +part.value;
          });
          return out;
        }

        function wallEpoch(year, month, day, hour, minute, second) {
          var date = new Date(0);
          date.setUTCFullYear(year, month - 1, day);
          date.setUTCHours(hour, minute, second || 0, 0);
          return date.getTime();
        }

        /**
         * Every instant at which a zone's clocks show a local date and time:
         * none in a gap the clocks skip, two in an hour they repeat.
         * @param {string} value YYYY-MM-DDTHH:MM.
         * @param {string} zone IANA name.
         * @returns {number[]} Epoch milliseconds, earliest first.
         */
        function candidates(value, zone) {
          var match = value.match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)$/);
          if (!match) throw new Error("enter a date and time");

          var want = wallEpoch(+match[1], +match[2], +match[3], +match[4], +match[5]);
          var found = [];
          // Sample offsets on either side of a clock change, then verify the
          // complete wall time. This handles gaps and half-hour changes too.
          [-48, -24, 0, 24, 48].forEach(function (hours) {
            var probe = want + hours * 3600000, parts = partsAt(probe, zone);
            var offset = wallEpoch(parts.year, parts.month, parts.day, parts.hour, parts.minute, parts.second) - probe;
            var ms = want - offset, check = partsAt(ms, zone);
            if (check.year === +match[1] && check.month === +match[2] && check.day === +match[3] && check.hour === +match[4] && check.minute === +match[5] && found.indexOf(ms) < 0) found.push(ms);
          });
          found.sort(function (a, b) { return a - b; });
          if (!found.length) throw new Error("that local time does not exist in the source zone");
          return found;
        }

        /* A zone's local date and time now, as the page's field holds it. */
        function localNow(zone) {
          var now = partsAt(Date.now(), zone);
          return String(now.year).padStart(4, "0") + "-" + pad(now.month) + "-" + pad(now.day) + "T" + pad(now.hour) + ":" + pad(now.minute);
        }

        function format(ms, zone) {
          return new Intl.DateTimeFormat(undefined, {
            timeZone: zone,
            dateStyle: "full",
            timeStyle: "long"
          }).format(new Date(ms));
        }

        function valid(zone) {
          try {
            new Intl.DateTimeFormat("en", { timeZone: zone });
            return true;
          } catch (e) {
            return false;
          }
        }

        /* Which fields hold no zone, in the page's words. */
        function zoneProblem(fromZone, toZone) {
          var bad = [];
          if (!valid(fromZone)) bad.push("from");
          if (!valid(toZone)) bad.push("to");
          return bad.length ? bad.join(" and ") + ": use an IANA time zone such as America/Chicago" : "";
        }

        var AGENT_TOOLS = [{
          name: "convert_time_zone",
          title: "convert a time between zones",
          description: "Say what a local date and time in one IANA time zone is in another, handling daylight " +
            "saving: a time that never happens (the clock skipped it) is refused, and one that happens " +
            "twice (the clock went back) uses the first unless told otherwise. Leave out dateTime for now.",
          input: {
            type: "object",
            properties: {
              dateTime: { type: "string", description: "Local date and time in the from zone, as YYYY-MM-DDTHH:MM." },
              from: { type: "string", description: "IANA zone such as America/Chicago, or UTC." },
              to: { type: "string", description: "IANA zone such as Asia/Tokyo." },
              occurrence: { type: "string", enum: ["earlier", "later"], default: "earlier", description: "Which one, when the local time happens twice." }
            },
            required: ["from", "to"]
          },
          readOnly: true,
          compute: function (args) {
            var fromZone = String(args.from == null ? "" : args.from).trim(), toZone = String(args.to == null ? "" : args.to).trim();
            var which = args.occurrence == null ? "earlier" : String(args.occurrence);
            if (which !== "earlier" && which !== "later") throw new Error("occurrence must be earlier or later");
            var problem = zoneProblem(fromZone, toZone);
            if (problem) throw new Error(problem);
            var value = args.dateTime == null || args.dateTime === "" ? localNow(fromZone) : String(args.dateTime).trim().slice(0, 16);
            if (!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(value)) throw new Error("dateTime must look like 2026-11-01T01:30");
            var list = candidates(value, fromZone), ms = which === "later" ? list[list.length - 1] : list[0];
            return { from: format(ms, fromZone), to: format(ms, toZone), instant: new Date(ms).toISOString(), happensTwice: list.length > 1 };
          }
        }];

        /* ── end core ──────────────────────────────────────────────── */

        var when = E.qs("#when");
        var from = E.qs("#from");
        var to = E.qs("#to");
        var result = E.qs("#result");
        var source = E.qs("#source");
        var dest = E.qs("#dest");
        var iso = E.qs("#iso");
        var copy = E.qs("#copy");
        var er = E.qs("#err");
        var report = "";
        var lastInstant = null, lastSource = "";
        var occurrence = E.qs("#occurrence"), overlap = E.qs("#overlap"), errorTimer = null;

        function clearOutput() {
          result.textContent = "";
          source.textContent = "";
          dest.textContent = "";
          iso.textContent = "";
          report = "";
          copy.disabled = true;
        }

        /* The instant the page shows: the occurrence chosen, unless the same
           local time was just shown, in which case the same instant stays. */
        function epochFor(value, zone, preferred) {
          var list = candidates(value, zone);
          overlap.hidden = list.length < 2;
          if (list.indexOf(preferred) >= 0) occurrence.value = preferred === list[0] ? "earlier" : "later";
          return occurrence.value === "later" ? list[list.length - 1] : list[0];
        }

        /* A zone name is mostly typed a letter at a time, so while typing an
           unknown name waits for a pause before it is called an error. */
        function run(eager) {
          clearTimeout(errorTimer);
          er.textContent = "";
          clearOutput();
          overlap.hidden = true;
          from.removeAttribute("aria-invalid");
          to.removeAttribute("aria-invalid");

          var problem = zoneProblem(from.value.trim(), to.value.trim());
          if (problem) {
            var bad = [from, to].filter(function (field) { return !valid(field.value.trim()); });
            var show = function () {
              bad.forEach(function (field) { field.setAttribute("aria-invalid", "true"); });
              er.textContent = problem;
            };
            if (eager === false) errorTimer = setTimeout(show, 600); else show();
            return;
          }

          try {
            var fromZone = from.value.trim(), toZone = to.value.trim();
            var sourceKey = when.value + "\n" + fromZone;
            var ms = epochFor(when.value, fromZone, sourceKey === lastSource ? lastInstant : null);
            var a = format(ms, fromZone);
            var b = format(ms, toZone);
            var instant = new Date(ms).toISOString();

            result.textContent = b;
            source.textContent = a;
            dest.textContent = b;
            iso.textContent = instant;
            report = b + "\n" + instant;
            lastInstant = ms;
            lastSource = sourceKey;
            copy.disabled = false;
          } catch (error) {
            er.textContent = error.message || "could not convert that time";
          }
        }

        var zones = typeof Intl.supportedValuesOf === "function"
          ? Intl.supportedValuesOf("timeZone")
          : [
              "UTC",
              "America/Chicago",
              "America/New_York",
              "America/Los_Angeles",
              "Europe/London",
              "Europe/Paris",
              "Asia/Tokyo",
              "Australia/Sydney"
            ];
        if (zones.indexOf("UTC") < 0) zones.unshift("UTC");
        var zoneList = E.qs("#zones");
        zones.forEach(function (zone) {
          zoneList.appendChild(E.el("option", { value: zone }));
        });

        var now = new Date();
        when.value = now.toISOString().slice(0, 16);
        to.value = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";

        var typed = E.debounce(function () { run(false); }, 160);
        [when, from, to].forEach(function (input) { E.on(input, "input", typed); });
        E.on(occurrence, "change", function () { lastSource = ""; run(); });
        E.on(E.qs("#convert"), "click", function () { run(); });
        E.on(E.qs("#swap"), "click", function () {
          from.value = from.value.trim(); to.value = to.value.trim();
          if (!valid(from.value) || !valid(to.value)) { run(); return; }
          var next, instant;
          try {
            instant = when.value + "\n" + from.value === lastSource && lastInstant !== null ? lastInstant : epochFor(when.value, from.value);
            next = partsAt(instant, to.value);
          } catch (error) { run(); return; }
          var value = from.value;
          from.value = to.value;
          to.value = value;
          when.value = String(next.year).padStart(4, "0") + "-" + pad(next.month) + "-" + pad(next.day) + "T" + pad(next.hour) + ":" + pad(next.minute);
          lastInstant = instant;
          lastSource = when.value + "\n" + from.value;
          run();
        });
        E.on(copy, "click", function () {
          E.copy(report, this);
        });
        run();

        /* For agents in the browser: the core's tool, with the conversion in
           the page's own fields. */
        E.agentTools(AGENT_TOOLS, {
          convert_time_zone: function (args) {
            var answer = AGENT_TOOLS[0].compute(args);
            from.value = String(args.from).trim();
            to.value = String(args.to).trim();
            when.value = args.dateTime == null || args.dateTime === "" ? localNow(from.value) : String(args.dateTime).trim().slice(0, 16);
            occurrence.value = args.occurrence === "later" ? "later" : "earlier";
            lastSource = "";
            run();
            return answer;
          }
        });
      });
</script>
</body>
</html>
