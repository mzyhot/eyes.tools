<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<script src="../site.js"></script>
</head>
<body data-tool="count">

<main class="stack-6">
  <section><label class="lbl" for="in">text</label><textarea class="field" id="in"></textarea></section>
  <dl class="kv" id="stats" aria-live="polite"><dt>words</dt><dd>0</dd><dt id="characters-label">characters</dt><dd>0</dd><dt>without spaces</dt><dd>0</dd><dt>code points</dt><dd>0</dd><dt>utf-8 bytes</dt><dd>0</dd><dt>lines</dt><dd>0</dd><dt>sentences</dt><dd>0</dd><dt>reading time</dt><dd>0 min</dd></dl>
  <div class="row"><button class="btn -ghost" id="copy" type="button">copy stats</button></div>
</main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
E.tool(function () {
  "use strict";

  /* ── core ──────────────────────────────────────────────────────────
     Pure: no DOM and no E. The site's MCP server (mcp-server.mjs) runs this
     block on its own, so an agent that never opens the page gets the same
     answers. AGENT_TOOLS is what the page and the server both offer. */

  var segmenter = typeof Intl.Segmenter === "function" ? new Intl.Segmenter(undefined, { granularity: "grapheme" }) : null;
  var wordSegmenter = typeof Intl.Segmenter === "function" ? new Intl.Segmenter(undefined, { granularity: "word" }) : null;
  /* Runs of text ended by . ! or ? and a space, plus any unfinished last
     sentence, so a draft that has not reached its full stop still counts. */
  function sentences(s) {
    return s.split(/[.!?]+(?:\s+|$)/).filter(function (part) { return /[\p{L}\p{N}]/u.test(part); }).length;
  }
  /* The readout, in the page's order. */
  function countText(s) {
    var points = Array.from(s), characters = segmenter ? Array.from(segmenter.segment(s), function (part) { return part.segment; }) : points;
    var words = wordSegmenter ? Array.from(wordSegmenter.segment(s)).filter(function (part) { return part.isWordLike; }).length : (s.trim() ? s.trim().split(/\s+/u).length : 0);
    return {
      words: words,
      characters: characters.length,
      charactersWithoutSpaces: characters.filter(function (c) { return !/^\s+$/u.test(c); }).length,
      codePoints: points.length,
      utf8Bytes: new TextEncoder().encode(s).length,
      lines: s ? s.split(/\r\n|\r|\n/).length : 0,
      sentences: sentences(s),
      readingTime: words ? Math.max(1, Math.ceil(words / 200)) + " min" : "0 min"
    };
  }

  var AGENT_TOOLS = [{
    name: "count_text",
    title: "count words and characters",
    description: "Count words, characters (as a person sees them), characters without spaces, Unicode code " +
      "points, UTF-8 bytes, lines and sentences in a text, and estimate its reading time at 200 words a minute.",
    input: {
      type: "object",
      properties: { text: { type: "string", maxLength: 10000000, description: "The text to count." } },
      required: ["text"],
      additionalProperties: false,
      examples: [{ text: "Hello, world. How are you?" }]
    },
    output: {
      type: "object",
      properties: {
        words: { type: "integer" },
        characters: { type: "integer", description: "As a person sees them: an emoji or an accented letter is one." },
        charactersWithoutSpaces: { type: "integer" },
        codePoints: { type: "integer" },
        utf8Bytes: { type: "integer" },
        lines: { type: "integer" },
        sentences: { type: "integer" },
        readingTime: { type: "string", description: "At 200 words a minute, such as \"2 min\"." }
      },
      required: ["words", "characters", "charactersWithoutSpaces", "codePoints", "utf8Bytes", "lines", "sentences", "readingTime"],
      additionalProperties: false
    },
    readOnly: true,
    compute: function (args) { return countText(String(args.text == null ? "" : args.text)); }
  }];

  /* ── end core ────────────────────────────────────────────────────── */

  var input = E.qs("#in"), stats = E.qsa("#stats dd");
  if (!segmenter) E.qs("#characters-label").textContent = "characters (code points)";
  function run() {
    var counts = countText(input.value);
    Object.keys(counts).forEach(function (key, index) { stats[index].textContent = counts[key]; });
  }
  E.on(input, "input", run);
  E.on(E.qs("#copy"), "click", function () {
    var labels = E.qsa("#stats dt");
    E.copy(stats.map(function (value, index) { return labels[index].textContent + "  " + value.textContent; }).join("\n"), this);
  });
  var query = E.param("t");
  if (query) input.value = query;
  run();

  /* For agents in the browser: the core's tool, with the text in the page's field. */
  E.agentTools(AGENT_TOOLS, {
    count_text: function (args) {
      input.value = String(args.text == null ? "" : args.text);
      run();
      return AGENT_TOOLS[0].compute(args);
    }
  });
});
</script>
</body>
</html>
