<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>count · 𓁹𓁹</title>
<meta name="description" content="count words, characters, lines, and reading time.">
<meta name="theme-color" content="#070707">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<script>(function(){try{var t=localStorage.getItem("eyes.theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
</head>
<body data-tool="count">
<div class="wrap">
  <header class="top"><a class="eyes" href="../index.html" data-eyes aria-label="𓁹𓁹 — all tools">𓁹𓁹</a><p class="crumb" data-crumb></p><span class="top__spacer"></span><button class="tbtn" type="button" data-theme-toggle>theme</button></header>
  <div class="head"><h1 class="h1" data-title></h1><p class="lede" data-lede></p></div>
  <main class="stack-6">
    <section><label class="lbl" for="in">text</label><textarea class="field" id="in"></textarea></section>
    <dl class="kv" id="stats" aria-live="polite"><dt>words</dt><dd>0</dd><dt id="characters-label">characters</dt><dd>0</dd><dt>without spaces</dt><dd>0</dd><dt>code points</dt><dd>0</dd><dt>utf-8 bytes</dt><dd>0</dd><dt>lines</dt><dd>0</dd><dt>sentences</dt><dd>0</dd><dt>reading time</dt><dd>0 min</dd></dl>
    <button class="btn -ghost" id="copy" type="button">copy stats</button>
  </main>
  <footer class="foot"><a href="../index.html">← all tools</a></footer>
</div>
<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
(function () {
  "use strict";
  var input = E.qs("#in"), stats = E.qsa("#stats dd");
  var segmenter = typeof Intl.Segmenter === "function" ? new Intl.Segmenter(undefined, { granularity: "grapheme" }) : null;
  var wordSegmenter = typeof Intl.Segmenter === "function" ? new Intl.Segmenter(undefined, { granularity: "word" }) : null;
  if (!segmenter) E.qs("#characters-label").textContent = "characters (code points)";
  function run() {
    var s = input.value, points = Array.from(s), characters = segmenter ? Array.from(segmenter.segment(s), function (part) { return part.segment; }) : points;
    var words = wordSegmenter ? Array.from(wordSegmenter.segment(s)).filter(function (part) { return part.isWordLike; }).length : (s.trim() ? s.trim().split(/\s+/u).length : 0);
    var withoutSpaces = characters.filter(function (c) { return !/^\s+$/u.test(c); }).length;
    var values = [words, characters.length, withoutSpaces, points.length, new TextEncoder().encode(s).length, s ? s.split(/\r\n|\r|\n/).length : 0,
      (s.match(/[.!?]+(?:\s|$)/g) || []).length, words ? Math.max(1, Math.ceil(words / 200)) + " min" : "0 min"];
    values.forEach(function (value, index) { stats[index].textContent = value; });
  }
  E.on(input, "input", run);
  E.on(E.qs("#copy"), "click", function () { E.copy(E.qs("#stats").innerText, this); });
  var query = E.param("t");
  if (query) input.value = query;
  run();
})();
</script>
</body>
</html>
