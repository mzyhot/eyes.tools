<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<style>
      .inspect-row {
        display: grid;
        grid-template-columns: minmax(3rem, .45fr) minmax(0, 1fr) minmax(0, 1fr);
        gap: var(--space-3);
        padding: var(--space-2) 0;
        border-top: var(--rule) solid var(--color-rule);
        font-family: var(--font-mono);
        font-size: var(--text-xs);
      }
      .inspect-row span { overflow-wrap: anywhere; }
      .inspect-head { color: var(--color-dim); }
      @media (max-width: 420px) {
        .inspect-row {
          grid-template-columns: minmax(2.5rem, .4fr) minmax(0, 1fr);
          row-gap: var(--space-1);
        }
        .inspect-row span:last-child { grid-column: 2; }
      }
    </style>
<script src="../site.js"></script>
</head>
<body data-tool="inspect">

<main class="stack-6">
      <section>
        <div class="seg" role="radiogroup" aria-label="character set">
          <label><input type="radio" name="mode" value="unicode" checked><span>unicode</span></label>
          <label><input type="radio" name="mode" value="ascii"><span>ascii</span></label>
        </div>
      </section>

      <section>
        <label class="lbl" for="in">text</label>
        <textarea class="field" id="in" spellcheck="false"></textarea>
        <p class="err" id="err" role="alert"></p>
      </section>

      <section>
        <div class="out-head">
          <span class="lbl" id="summary">characters</span>
          <span class="row__spacer"></span>
          <button class="tbtn" id="copy" type="button" disabled>copy table</button>
          <button class="tbtn" id="download" type="button" disabled>download tsv</button>
        </div>
        <div id="out" aria-live="polite"></div>
      </section>
    </main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
      E.tool(function () {
        "use strict";

        /* ── core ────────────────────────────────────────────────────
           Pure: no DOM and no E. The site's MCP server (mcp-server.mjs)
           runs this block on its own, so an agent that never opens the page
           gets the same answers. AGENT_TOOLS is what both offer. */

        var MAX_ROWS = 10000;
        var names = [
          "NUL", "SOH", "STX", "ETX", "EOT", "ENQ", "ACK", "BEL",
          "BS", "HT", "LF", "VT", "FF", "CR", "SO", "SI",
          "DLE", "DC1", "DC2", "DC3", "DC4", "NAK", "SYN", "ETB",
          "CAN", "EM", "SUB", "ESC", "FS", "GS", "RS", "US"
        ];

        /* Characters that render as nothing, or as something indistinguishable
           from a space. Naming them is the whole point of the tool, so the table
           is hoisted out of the per-character path; it used to be rebuilt, all
           twenty-one entries, once for every row on the page. */
        var INVISIBLE = {
          160: "no-break space", 173: "soft hyphen", 8203: "zero-width space",
          8204: "zero-width non-joiner", 8205: "zero-width joiner", 8206: "left-to-right mark",
          8207: "right-to-left mark", 8232: "line separator", 8233: "paragraph separator",
          8234: "left-to-right embedding", 8235: "right-to-left embedding", 8236: "pop directional formatting",
          8237: "left-to-right override", 8238: "right-to-left override", 8239: "narrow no-break space",
          8288: "word joiner", 8294: "left-to-right isolate", 8295: "right-to-left isolate",
          8296: "first strong isolate", 8297: "pop directional isolate", 65279: "byte-order mark"
        };
        var WHITESPACE = /^\s$/u;
        var encoder = new TextEncoder();
        var HEX = new Array(256);
        for (var hexByte = 0; hexByte < 256; hexByte++) HEX[hexByte] = (hexByte < 16 ? "0" : "") + hexByte.toString(16);

        /* What to print in the character column: a name when the glyph itself
           would show nothing useful, otherwise the character. */
        function shown(character) {
          var cp = character.codePointAt(0);
          if (cp < 32) return names[cp];
          if (cp === 127) return "DEL";
          if (character === " ") return "space";
          if (INVISIBLE[cp]) return INVISIBLE[cp];
          if (WHITESPACE.test(character)) return "whitespace";
          return character;
        }

        /* The UTF-8 bytes of one character, as spaced hex. */
        function utf8(character) {
          var bytes = encoder.encode(character), out = "", i;
          for (i = 0; i < bytes.length; i++) out += (i ? " " : "") + HEX[bytes[i]];
          return out;
        }

        function firstCharacters(value, limit) {
          var rows = [];
          var offset = 0;
          while (offset < value.length && rows.length < limit) {
            var codePoint = value.codePointAt(offset);
            var character = String.fromCodePoint(codePoint);
            rows.push(character);
            offset += character.length;
          }
          return { rows: rows, truncated: offset < value.length };
        }

        /**
         * The table for a text: one [character, code, detail] row per
         * character, for its first MAX_ROWS characters.
         * @returns {{rows: string[][], truncated: boolean, nonAscii: boolean}}
         */
        function inspect(value, ascii) {
          var scan = firstCharacters(value, MAX_ROWS), nonAscii = false;
          var rows = scan.rows.map(function (character) {
            var codePoint = character.codePointAt(0);
            if (ascii && codePoint > 127) nonAscii = true;
            var code = ascii
              ? (codePoint < 128 ? String(codePoint) : "outside ascii")
              : "U+" + codePoint.toString(16).toUpperCase().padStart(4, "0");
            var label = ascii && codePoint < 32 ? names[codePoint] : ascii && codePoint === 127 ? "DEL" : utf8(character);
            return [shown(character), code, label];
          });
          return { rows: rows, truncated: scan.truncated, nonAscii: nonAscii };
        }
        function columns(ascii) {
          return ascii ? ["character", "ascii decimal", "name or utf-8 bytes"] : ["character", "code point", "utf-8 bytes"];
        }

        var AGENT_ROWS = 2000;
        var AGENT_TOOLS = [{
          name: "inspect_text",
          title: "list the characters in text",
          description: "List every character in a text with its code point and UTF-8 bytes, naming the ones " +
            "that are invisible or look like a space (zero-width, no-break, direction marks, control " +
            "characters). With the ascii set, codes are ascii decimals and anything past 127 is marked.",
          input: {
            type: "object",
            properties: {
              text: { type: "string", maxLength: 1000000, description: "The text to look through, such as a line that should match another but does not." },
              set: { type: "string", enum: ["unicode", "ascii"], default: "unicode", description: "ascii gives ascii decimals and marks anything past 127." }
            },
            required: ["text"],
            additionalProperties: false,
            examples: [{ text: "a\u00a0b\u200bc" }]
          },
          output: {
            type: "object",
            properties: {
              columns: { type: "array", items: { type: "string" }, description: "What each row's cells are." },
              rows: { type: "array", items: { type: "array", items: { type: "string" } }, description: "One a character, in order; up to 2,000." },
              truncated: { type: "boolean", description: "Present when the text had more characters than rows." },
              note: { type: "string" }
            },
            required: ["columns", "rows"],
            additionalProperties: false
          },
          readOnly: true,
          compute: function (args) {
            var set = args.set == null ? "unicode" : String(args.set);
            if (set !== "unicode" && set !== "ascii") throw new Error("set must be unicode or ascii");
            var table = inspect(String(args.text == null ? "" : args.text), set === "ascii");
            var result = { columns: columns(set === "ascii"), rows: table.rows.slice(0, AGENT_ROWS) };
            if (table.truncated || table.rows.length > AGENT_ROWS) result.truncated = true;
            if (table.nonAscii) result.note = "non-ascii characters are marked outside ascii";
            return result;
          }
        }];

        /* ── end core ──────────────────────────────────────────────── */

        var input = E.qs("#in");
        var output = E.qs("#out");
        var error = E.qs("#err");
        var copy = E.qs("#copy");
        var download = E.qs("#download");
        var summary = E.qs("#summary");
        var report = "";

        function mode() {
          var selected = E.qsa("input[name=mode]").filter(function (radio) {
            return radio.checked;
          })[0];
          return selected ? selected.value : "unicode";
        }

        function row(host, cells, head) {
          host.appendChild(E.el("div", head ? { class: "inspect-row inspect-head", "aria-hidden": "true" } : { class: "inspect-row" },
            cells.map(function (cell) { return E.el("span", { text: cell }); })));
        }

        function run() {
          var ascii = mode() === "ascii", table = inspect(input.value, ascii), rows = table.rows;
          output.textContent = "";
          error.textContent = "";
          copy.disabled = rows.length === 0;
          download.disabled = rows.length === 0;
          summary.textContent = rows.length
            ? (table.truncated ? "first " : "") + rows.length.toLocaleString() + (rows.length === 1 ? " character" : " characters")
            : "characters";
          if (table.truncated) {
            error.textContent = "showing the first " + MAX_ROWS.toLocaleString() + " characters to keep the page responsive";
          }
          if (table.nonAscii) {
            error.textContent += (error.textContent ? " · " : "") + "non-ascii characters are marked outside ascii";
          }

          /* Rows are assembled off-document and appended once. Ten thousand
             live appends would lay the page out ten thousand times. */
          var frag = document.createDocumentFragment();
          if (rows.length) row(frag, columns(ascii).map(function (c) { return c === "name or utf-8 bytes" ? "name / utf-8 bytes" : c; }), true);
          rows.forEach(function (cells) { row(frag, cells); });
          output.appendChild(frag);
          report = rows.map(function (cells) { return cells.join("\t"); }).join("\n");
        }

        E.on(input, "input", run);
        E.qsa("input[name=mode]").forEach(function (radio) {
          E.on(radio, "change", run);
        });
        E.on(copy, "click", function () { E.copy(report, this); });
        E.on(download, "click", function () {
          var header = "character\t" + (mode() === "ascii" ? "ascii decimal\tname / utf-8 bytes" : "unicode\tutf-8 bytes");
          E.download(header + "\n" + report, "characters.tsv", "text/tab-separated-values;charset=utf-8");
          E.flash(this, "downloaded");
        });
        var query = E.param("t");
        if (query) input.value = query;
        run();

        /* For agents in the browser: the core's tool, with the text in the
           page's field. */
        E.agentTools(AGENT_TOOLS, {
          inspect_text: function (args) {
            var result = AGENT_TOOLS[0].compute(args);
            E.qs('input[name=mode][value="' + (args.set === "ascii" ? "ascii" : "unicode") + '"]').checked = true;
            input.value = String(args.text);
            run();
            return result;
          }
        });
      });
</script>
</body>
</html>
