<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>base64 · 𓁹𓁹</title>
<meta name="description" content="encode and decode base64 locally.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<script>(function(){try{var t=localStorage.getItem("eyes.theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
</head>
<body data-tool="base64">
<div class="wrap">
  <header class="top"><a class="eyes" href="../index.html" data-eyes aria-label="𓁹𓁹 — all tools">𓁹𓁹</a><p class="crumb" data-crumb></p><span class="top__spacer"></span><button class="tbtn" type="button" data-theme-toggle>theme</button></header>
  <div class="head"><h1 class="h1" data-title></h1><p class="lede" data-lede></p></div>
  <main class="stack-6">
    <section>
      <label class="lbl" for="in">input</label>
      <textarea class="field" id="in"></textarea>
      <label class="check mt-2"><input type="checkbox" id="url-safe"><span>url-safe encoding</span></label>
      <p class="hint">decoding accepts standard and url-safe base64.</p>
      <div class="row mt-2"><button class="btn" id="enc" type="button">encode</button><button class="btn -ghost" id="dec" type="button">decode</button><button class="btn -ghost" type="button" data-copy="#out">copy</button></div>
      <p class="err" id="err" role="alert"></p>
    </section>
    <section><label class="lbl" for="out">result</label><textarea class="field" id="out" readonly aria-live="polite"></textarea></section>
    <section class="section--ruled">
      <label class="lbl" for="file">file to data uri</label>
      <input class="field" id="file" type="file" aria-describedby="file-hint">
      <p class="hint" id="file-hint">the file stays in this tab and is never uploaded.</p>
      <label class="lbl mt-4" for="uri">data uri</label>
      <textarea class="field" id="uri" readonly aria-live="polite"></textarea>
      <button class="btn -ghost mt-2" type="button" data-copy="#uri">copy data uri</button>
    </section>
  </main>
  <footer class="foot"><a href="../index.html">← all tools</a><span class="row__spacer"></span><span>runs in your browser · nothing is uploaded</span></footer>
</div>
<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
/* base64, both directions, over UTF-8 rather than over code units — `btoa`
   alone throws on anything above U+00FF, which is most of the text people
   actually paste. The file field produces a data URI instead, read by the
   browser rather than rebuilt here.

   Encoding goes through a binary string because that is what `btoa` takes. It
   is built in blocks: `String.fromCharCode.apply` over a whole array overflows
   the engine's argument limit somewhere above a hundred thousand bytes, while
   appending one character at a time is several times slower than appending one
   block at a time. */
(function () {
  "use strict";
  var input = E.qs("#in"), output = E.qs("#out"), error = E.qs("#err"), fileInput = E.qs("#file"), uri = E.qs("#uri"), fileSeq = 0, activeReader = null;
  var BLOCK = 8192;
  function bytes(value) { return new TextEncoder().encode(value); }
  function encode(value) {
    var data = bytes(value), binary = "", i;
    for (i = 0; i < data.length; i += BLOCK) binary += String.fromCharCode.apply(null, data.subarray(i, i + BLOCK));
    var result = btoa(binary);
    return E.qs("#url-safe").checked ? result.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") : result;
  }
  function decode(value) {
    var normalized = value.replace(/\s/g, "").replace(/-/g, "+").replace(/_/g, "/");
    var binary = atob(normalized), data = new Uint8Array(binary.length), i;
    for (i = 0; i < binary.length; i++) data[i] = binary.charCodeAt(i);
    return new TextDecoder("utf-8", { fatal: true }).decode(data);
  }
  E.on(E.qs("#enc"), "click", function () { try { error.textContent = ""; output.value = encode(input.value); } catch (e) { output.value = ""; error.textContent = "could not encode this text"; } });
  E.on(E.qs("#dec"), "click", function () { try { error.textContent = ""; output.value = decode(input.value); } catch (e) { output.value = ""; error.textContent = "invalid base64 or utf-8"; } });
  E.on(fileInput, "change", function () {
    var file = this.files && this.files[0], seq = ++fileSeq;
    if (activeReader && activeReader.readyState === 1) activeReader.abort();
    uri.value = "";
    error.textContent = "";
    if (!file) return;
    if (file.size > 16 * 1024 * 1024) { error.textContent = "data uri files are limited to 16 MB to keep this tab responsive"; return; }
    var reader = activeReader = new FileReader();
    reader.onload = function () { if (seq === fileSeq) uri.value = String(reader.result || ""); };
    reader.onerror = function () { if (seq === fileSeq) error.textContent = "could not read that file"; };
    reader.onabort = function () { if (seq === fileSeq) error.textContent = "file read cancelled"; };
    try { reader.readAsDataURL(file); } catch (e) { error.textContent = "could not read that file"; }
  });
  var query = E.param("t");
  if (query) { input.value = query; E.qs("#enc").click(); }
})();
</script>
</body>
</html>
