<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<script src="../site.js"></script>
<script src="../theme.js"></script>
</head>
<body data-tool="base64">

<main class="stack-6">
  <section>
    <label class="lbl" for="in">input</label>
    <textarea class="field" id="in"></textarea>
    <label class="check mt-2"><input type="checkbox" id="url-safe"><span>url-safe encoding</span></label>
    <p class="hint">decoding accepts standard and url-safe base64.</p>
    <div class="row mt-2"><button class="btn" id="enc" type="button">encode</button><button class="btn -ghost" id="dec" type="button">decode</button><button class="btn -ghost" type="button" data-copy="#out">copy</button></div>
    <p class="err" id="err" role="alert"></p>
  </section>
  <section><label class="lbl" for="out">result</label><textarea class="field" id="out" readonly aria-live="polite"></textarea></section>
  <section class="section--ruled">
    <label class="lbl" for="file">file to data uri</label>
    <input class="field" id="file" type="file" aria-describedby="file-hint">
    <p class="hint" id="file-hint">the file stays in this tab and is never uploaded.</p>
    <p class="err" id="file-err" role="alert"></p>
    <label class="lbl mt-4" for="uri">data uri</label>
    <textarea class="field" id="uri" readonly aria-live="polite"></textarea>
    <button class="btn -ghost mt-2" type="button" data-copy="#uri">copy data uri</button>
  </section>
</main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
/* base64, both directions, over UTF-8 rather than over code units — `btoa`
   alone throws on anything above U+00FF, which is most of the text people
   actually paste. The file field produces a data URI instead, read by the
   browser rather than rebuilt here.

   Encoding goes through a binary string because that is what `btoa` takes. It
   is built in blocks: `String.fromCharCode.apply` over a whole array overflows
   the engine's argument limit somewhere above a hundred thousand bytes, while
   appending one character at a time is several times slower than appending one
   block at a time. */
E.tool(function () {
  "use strict";
  /* ── core ──────────────────────────────────────────────────────────
     Pure: no DOM and no E. The site's MCP server (mcp-server.mjs) runs this
     block on its own, so an agent that never opens the page gets the same
     answers. AGENT_TOOLS is what the page and the server both offer. */

  var BLOCK = 8192;
  function bytes(value) { return new TextEncoder().encode(value); }
  function encode(value, urlSafe) {
    var data = bytes(value), binary = "", i;
    for (i = 0; i < data.length; i += BLOCK) binary += String.fromCharCode.apply(null, data.subarray(i, i + BLOCK));
    var result = btoa(binary);
    return urlSafe ? result.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") : result;
  }
  function decode(value) {
    var normalized = value.replace(/\s/g, "").replace(/-/g, "+").replace(/_/g, "/"), binary, i;
    try { binary = atob(normalized); } catch (e) { throw new Error("not valid base64"); }
    var data = new Uint8Array(binary.length);
    for (i = 0; i < binary.length; i++) data[i] = binary.charCodeAt(i);
    try { return new TextDecoder("utf-8", { fatal: true }).decode(data); }
    catch (e) { throw new Error("valid base64, but the bytes are not utf-8 text"); }
  }
  function text(value) { return String(value == null ? "" : value); }

  var AGENT_TOOLS = [{
    name: "base64_encode",
    title: "encode text as base64",
    description: "Encode text (as UTF-8) to base64, optionally the url-safe alphabet without padding.",
    input: {
      type: "object",
      properties: {
        text: { type: "string", description: "The text to encode." },
        urlSafe: { type: "boolean", description: "Use - and _ and drop the = padding.", default: false }
      },
      required: ["text"]
    },
    readOnly: true,
    compute: function (args) { return { base64: encode(text(args.text), !!args.urlSafe) }; }
  }, {
    name: "base64_decode",
    title: "decode base64 to text",
    description: "Decode standard or url-safe base64 back to UTF-8 text. Refuses input that is not base64 " +
      "or does not decode to UTF-8 text.",
    input: {
      type: "object",
      properties: { base64: { type: "string", description: "The base64 to decode; spaces and line breaks are ignored." } },
      required: ["base64"]
    },
    readOnly: true,
    compute: function (args) { return { text: decode(text(args.base64)) }; }
  }];

  /* ── end core ────────────────────────────────────────────────────── */

  var input = E.qs("#in"), output = E.qs("#out"), error = E.qs("#err"), fileInput = E.qs("#file"), uri = E.qs("#uri"), fileError = E.qs("#file-err"), fileSeq = 0, activeReader = null;
  /* Which button produced the result, so the url-safe box can redo an encode
     rather than leave the other alphabet on screen. */
  var shown = null;
  /* The chosen direction wears the primary style, as json's and url's do. */
  function choose(direction) {
    shown = direction;
    ["enc", "dec"].forEach(function (id) {
      var button = E.qs("#" + id);
      button.classList.toggle("-ghost", id !== direction);
      button.setAttribute("aria-pressed", String(id === direction));
    });
  }
  function runEncode() { choose("enc"); try { error.textContent = ""; output.value = encode(input.value, E.qs("#url-safe").checked); } catch (e) { output.value = ""; error.textContent = "could not encode this text"; } }
  function runDecode() { choose("dec"); try { error.textContent = ""; output.value = decode(input.value); } catch (e) { output.value = ""; error.textContent = e.message; } }
  E.on(E.qs("#enc"), "click", runEncode);
  E.on(E.qs("#dec"), "click", runDecode);
  /* Once a direction is chosen the result follows the input, so an edit never
     leaves a stale answer on screen. */
  E.on(input, "input", E.debounce(function () {
    if (shown === "enc") runEncode();
    else if (shown === "dec") runDecode();
  }));
  E.on(E.qs("#url-safe"), "change", function () { if (shown === "enc") runEncode(); });
  E.on(fileInput, "change", function () {
    var file = this.files && this.files[0], seq = ++fileSeq;
    if (activeReader && activeReader.readyState === 1) activeReader.abort();
    uri.value = "";
    fileError.textContent = "";
    if (!file) return;
    if (file.size > 16 * 1024 * 1024) { fileError.textContent = "data uri files are limited to 16 MB to keep this tab responsive"; return; }
    var reader = activeReader = new FileReader();
    reader.onload = function () { if (seq === fileSeq) uri.value = String(reader.result || ""); };
    reader.onerror = function () { if (seq === fileSeq) fileError.textContent = "could not read that file"; };
    reader.onabort = function () { if (seq === fileSeq) fileError.textContent = "file read cancelled"; };
    try { reader.readAsDataURL(file); } catch (e) { fileError.textContent = "could not read that file"; }
  });
  var query = E.param("t");
  if (query) { input.value = query; E.qs("#enc").click(); }

  /* For agents in the browser: the core's tools, run through the page's own
     fields so the visitor sees what was asked. */
  E.agentTools(AGENT_TOOLS, {
    base64_encode: function (args) {
      E.qs("#url-safe").checked = !!args.urlSafe;
      input.value = text(args.text);
      runEncode();
      return AGENT_TOOLS[0].compute(args);
    },
    base64_decode: function (args) {
      input.value = text(args.base64);
      runDecode();
      return AGENT_TOOLS[1].compute(args);
    }
  });
});
</script>
</body>
</html>
