<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<style>#preview{display:block;max-width:100%;height:auto}</style>
<script src="../site.js"></script>
</head>
<body data-tool="img">

<main class="stack-6">
<section><label class="lbl" for="file">image</label><input class="field" id="file" type="file" accept="image/*,.jpg,.jpeg,.jfif,.png,.apng,.gif,.webp,.avif,.svg,.bmp,.ico"><p class="hint">typically jpeg, png, apng, gif, webp, avif, svg, bmp, and ico · support depends on your browser · animation becomes one frame</p></section>
<section class="stack"><div class="grid2"><div><label class="lbl" for="w">width</label><input class="field" id="w" type="number" min="1" max="12000" step="1"></div><div><label class="lbl" for="h">height</label><input class="field" id="h" type="number" min="1" max="12000" step="1"></div></div><div class="row"><label class="check"><input id="lock" type="checkbox" checked><span>keep proportions</span></label><span class="row__spacer"></span><button class="tbtn" id="original" type="button" disabled>original size</button></div></section><section class="grid2"><div><label class="lbl" for="fmt">format</label><select class="field" id="fmt"><option value="image/png">png</option><option value="image/jpeg">jpeg</option><option value="image/webp" selected>webp</option></select></div><div><label class="lbl" for="q">quality</label><input id="q" type="range" min="1" max="100" value="82"><p class="hint"><span id="qv">82</span>%</p></div></section>
<p class="err" id="err" role="alert"></p><figure class="figure" id="frame" hidden><canvas id="preview" role="img" aria-label="resized image preview"></canvas></figure><div class="row"><button class="btn" id="dl" type="button" disabled>download</button><span class="hint" id="meta" aria-live="polite"></span></div>
</main>

<script src="../tools.js"></script>

<script>

          }));
