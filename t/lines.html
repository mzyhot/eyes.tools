<meta charset="utf-8">

<title>dump · 𓁹𓁹</title>
<meta name="robots" content="noindex">

<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<script>
(function () {
  "use strict";
  try {
    var theme = localStorage.getItem("eyes.theme");
    if (theme) document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
  var destination = new URL(location.protocol === "file:" ? "dump.html" : "/dump", location.href);
  destination.search = location.search;
  destination.searchParams.set("mode", "lines");
  destination.hash = location.hash;
  location.replace(destination.href);
})();
</script>
</head>
<body>
<main class="wrap"><a href="/dump?mode=lines">open dump →</a></main>
</body>
