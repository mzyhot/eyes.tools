<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<script src="../site.js"></script>
</head>
<body data-tool="exif">

<main class="stack-6">

  <section>
    <label class="lbl" for="file">image file</label>
    <input class="field" id="file" type="file" accept="image/*,.jpg,.jpeg,.jxl,.png,.webp,.gif,.tif,.tiff,.heic,.heif,.avif">
    <p class="hint">jpeg, tiff, png, webp, heic, heif, avif, gif, and jpeg xl · exif, iptc, xmp, icc, and container metadata</p>
    <p class="err" id="err" role="alert"></p>
  </section>

  <section class="stack">
    <div id="filter-wrap" hidden>
      <label class="lbl" for="filter">filter metadata</label>
      <input class="field" id="filter" type="search" autocomplete="off">
    </div>
    <div class="out-head">
      <span class="lbl" id="summary">metadata</span>
      <span class="row__spacer"></span>
      <button class="tbtn" id="copy" type="button" disabled>copy</button>
      <button class="tbtn" id="download" type="button" disabled>download json</button>
    </div>
    <dl class="kv -stack" id="out" aria-live="polite"></dl>
  </section>

</main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
/* Metadata: hand the chosen file to the vendored ExifReader and list every
   field it finds as "group · tag" rows, which can be filtered, copied as
   tab-separated text, or downloaded as JSON. The file never leaves the tab.

   ExifReader returns nested groups of tags, each tag an object with a
   human-readable `description`. The flattening below keeps the descriptions
   and drops what would only be noise in a readout: thumbnails, maker notes,
   padding and raw binary blocks. */
E.tool(function () {
  "use strict";

  /* ── core ──────────────────────────────────────────────────────────
     Pure: no DOM and no E, only exif-reader.js and media.js. The site's MCP
     server (mcp-server.mjs) runs this block on its own, so an agent that never
     opens the page gets the fields the page lists. AGENT_TOOLS is what the
     page and the server both offer. */

  var SKIP = /thumbnail|makernote|padding|undefinedtag|metadatarange|mpf.*image|^_raw$/i;
  var BINARY = "[binary data]", STRUCTURED = "[structured data]";
  var IMAGE_CAP = 10 * 1024 * 1024;

  /* A tag value as one readable, bounded line. */
  function text(v) {
    if (v == null) return "";
    if (ArrayBuffer.isView(v) || v instanceof ArrayBuffer) return BINARY;
    if (Array.isArray(v)) return v.length > 32 ? "[" + v.length + " values]" : v.map(text).join(", ");
    if (typeof v === "object") {
      try {
        var json = JSON.stringify(v);
        return json.length > 300 ? json.slice(0, 297) + "…" : json;
      } catch (e) { return STRUCTURED; }
    }
    var s = String(v);
    return s.length > 2000 ? s.slice(0, 1997) + "…" : s;
  }

  /* Prefer ExifReader's own description of a tag over its raw value. */
  function hasDescription(tag) {
    return typeof tag === "object" && !Array.isArray(tag) && !ArrayBuffer.isView(tag) &&
      Object.prototype.hasOwnProperty.call(tag, "description");
  }
  function valueText(tag) {
    if (tag == null) return "";
    return text(hasDescription(tag) ? tag.description : tag);
  }

  /* Expanded tags → sorted [label, value] rows. A group is either a tag itself
     (shown as "metadata · group") or a map of tags ("group · tag"). */
  function flatten(tags) {
    /* ExifReader can report one fact under two groups (a png's header
       appears as both "png" and "pngFile"), so a tag already listed with the
       same value is not listed again. */
    var rows = [], seen = new Set();
    function add(group, key, value) {
      var fact = key + "\u0000" + value;
      if (seen.has(fact)) return;
      seen.add(fact);
      rows.push([group + " · " + key, value]);
    }
    Object.keys(tags || {}).sort().forEach(function (group) {
      var value = tags[group], single;
      if (value == null || SKIP.test(group)) return;
      if (typeof value !== "object" || Array.isArray(value) || ArrayBuffer.isView(value) || hasDescription(value)) {
        single = valueText(value);
        if (single && single !== BINARY && single !== STRUCTURED) add("metadata", group, single);
        return;
      }
      Object.keys(value).sort().forEach(function (key) {
        if (SKIP.test(key)) return;
        var d = valueText(value[key]);
        if (d && d !== BINARY && d !== STRUCTURED) add(group, key, d);
      });
    });
    return rows;
  }

  /* Nothing to read is an answer, not a failure. */
  function nothingThere(e) {
    return !!(e && (e.name === "MetadataMissingError" || /no exif data|no metadata blocks found/i.test(e.message || "")));
  }

  /**
   * An image's metadata as the page lists it.
   * @param {Uint8Array} bytes The whole file.
   * @returns {Promise<Object>} The tool's answer.
   */
  function describeImage(bytes) {
    var buffer = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
    return Promise.resolve().then(function () {
      return ExifReader.load(buffer, { expanded: true, async: true });
    }).then(flatten, function (e) {
      if (nothingThere(e)) return [];
      throw new Error("metadata could not be read; the file may be unsupported or malformed");
    }).then(function (rows) {
      var fields = {};
      rows.forEach(function (row) { fields[row[0]] = row[1]; });
      var answer = { type: Media.type(bytes) || "unknown", bytes: bytes.length, count: rows.length, fields: fields };
      if (!rows.length) answer.note = "no readable metadata fields were found";
      return answer;
    });
  }

  var AGENT_TOOLS = [{
    name: "read_image_metadata",
    title: "read an image's metadata",
    description: "Read the metadata inside an image: camera, lens, exposure, dates, gps position, color profile, " +
      "dimensions and more, from exif, iptc, icc and the file's own headers, as \"group · tag\" fields. Reads jpeg, " +
      "tiff, png, webp, heic, avif, gif and jpeg xl. Send the image as base64, up to 10 MB. On the metadata page, " +
      "xmp is read too, and the image the visitor chose is used when none is sent.",
    input: {
      type: "object",
      properties: {
        image: {
          type: "string", contentEncoding: "base64", contentMediaType: "image/*", maxLength: 14000000,
          description: "The image, as base64 or a data: URL. On the metadata page, leave it out to use the image the visitor chose."
        }
      },
      required: ["image"],
      additionalProperties: false,
      examples: [{ image: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4z8DwHwAFAAH/q842iQAAAABJRU5ErkJggg==" }]
    },
    output: {
      type: "object",
      properties: {
        type: { type: "string", description: "The file's type, told from its first bytes, or unknown." },
        bytes: { type: "integer", minimum: 0, description: "The file's size." },
        count: { type: "integer", minimum: 0, description: "How many fields were read." },
        fields: { type: "object", additionalProperties: { type: "string" }, description: "\"group · tag\" → its value, as one readable line." },
        note: { type: "string", description: "Present when there was nothing to read." }
      },
      required: ["type", "bytes", "count", "fields"],
      additionalProperties: false
    },
    readOnly: true,
    compute: function (args) {
      return describeImage(Media.bytes(args.image, "image", IMAGE_CAP));
    }
  }];

  /* ── end core ────────────────────────────────────────────────────── */

  var input = E.qs("#file"), out = E.qs("#out"), er = E.qs("#err"), summary = E.qs("#summary");
  var filter = E.qs("#filter"), filterWrap = E.qs("#filter-wrap"), copy = E.qs("#copy"), download = E.qs("#download");
  var report = "", allRows = [], shown = [], filename = "metadata", loadSeq = 0;

  /* What the browser itself knows about the file, shown even when parsing fails. */
  function fileRows(f) {
    var rows = [["file · name", f.name], ["file · type", f.type || "unknown"], ["file · size", E.bytes(f.size)]];
    var modified = Number(f.lastModified);
    if (isFinite(modified) && modified > 0) rows.push(["file · modified", new Date(modified).toLocaleString()]);
    return rows;
  }

  /* Draw the rows that match the filter; with `rows`, replace the full set first. */
  function render(rows) {
    if (rows) allRows = rows;
    var term = filter.value.trim().toLowerCase();
    shown = allRows.filter(function (row) { return !term || row.join(" ").toLowerCase().indexOf(term) > -1; });
    out.textContent = "";
    report = shown.map(function (r) { return r.join("\t"); }).join("\n");
    shown.forEach(function (r) {
      out.appendChild(E.el("dt", { text: r[0] }));
      out.appendChild(E.el("dd", { text: r[1] }));
    });
    summary.textContent = shown.length + (term ? " of " + allRows.length : "") + ((term ? allRows.length : shown.length) === 1 ? " field" : " fields");
    filterWrap.hidden = !allRows.length;
    copy.disabled = !shown.length;
    download.disabled = !shown.length;
  }

  function clear() {
    out.textContent = "";
    report = "";
    allRows = [];
    shown = [];
    filter.value = "";
    er.textContent = "";
    summary.textContent = "metadata";
    filterWrap.hidden = true;
    copy.disabled = true;
    download.disabled = true;
  }

  /* Reading only the start of the file is fast, but some layouts keep their
     metadata further in; ExifReader says so with this message, and a full read
     then finds it. */
  function needsFullRead(e) {
    return !!(e && /^length: "auto" could not locate metadata/i.test(e.message || ""));
  }
  function readTags(Reader, f) {
    return Promise.resolve().then(function () {
      return Reader.load(f, { expanded: true, includeOffsets: true, async: true, length: "auto" });
    }).catch(function (e) {
      if (!needsFullRead(e)) throw e;
      return Reader.load(f, { expanded: true, async: true });
    });
  }

  /* Each file gets a sequence number so a slow read cannot draw over a file
     chosen after it. */
  E.on(input, "change", function () {
    var f = this.files && this.files[0], seq = ++loadSeq;
    clear();
    if (!f) return;
    filename = f.name.replace(/\.[^.]*$/, "") || "metadata";
    var base = fileRows(f), Reader = window.ExifReader;
    if (!Reader || typeof Reader.load !== "function") {
      render(base);
      er.textContent = "the metadata reader failed to load";
      return;
    }
    summary.textContent = "reading…";
    readTags(Reader, f).then(function (tags) {
      if (seq !== loadSeq) return;
      var fields = flatten(tags);
      render(base.concat(fields));
      if (!fields.length) er.textContent = "no readable metadata fields were found";
    }).catch(function (e) {
      if (seq !== loadSeq) return;
      render(base);
      er.textContent = nothingThere(e)
        ? "no readable metadata fields were found"
        : "metadata could not be read; the file may be unsupported or malformed";
    });
  });

  E.on(copy, "click", function () { E.copy(report, this); });
  E.on(filter, "input", function () { render(); });
  E.on(download, "click", function () {
    if (!shown.length) return;
    var data = Object.create(null);
    shown.forEach(function (row) { data[row[0]] = row[1]; });
    E.download(JSON.stringify(data, null, 2) + "\n", filename + "-metadata.json", "application/json");
    E.flash(this, "downloaded");
  });

  /* For agents in the browser: an image the agent sends is put in the page's
     file field, as if the visitor had chosen it, and listed there; with none,
     the visitor's own image is read. The answer is the core's either way. */
  E.agentTools(AGENT_TOOLS, {
    read_image_metadata: function (args) {
      if (args.image != null) {
        var bytes = Media.bytes(args.image, "image", IMAGE_CAP);
        E.giveFile(input, new File([bytes], "image from the agent", { type: Media.type(bytes) || "" }));
        return describeImage(bytes);
      }
      var f = input.files && input.files[0];
      if (!f) throw new Error("no image is chosen on the page; send one as base64, or ask the visitor to choose or drop one");
      if (f.size > 64 * 1024 * 1024) throw new Error("the chosen image is over 64 MB, more than is read for an agent");
      return f.arrayBuffer().then(function (buffer) { return describeImage(new Uint8Array(buffer)); });
    }
  }, ["image"]);
});
</script>
</body>
</html>
