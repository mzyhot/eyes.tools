<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<script src="../site.js"></script>
<script src="../theme.js"></script>
</head>
<body data-tool="json">

<main class="stack-6">
  <section>
    <label class="lbl" for="in">json</label>
    <textarea class="field" id="in"></textarea>
    <div class="grid2 mt-4"><div><label class="lbl" for="indent">indent</label><select class="field" id="indent"><option value="2">2 spaces</option><option value="4">4 spaces</option><option value="tab">tabs</option></select></div></div>
    <div class="row mt-2"><button class="btn" id="fmt" type="button">format</button><button class="btn -ghost" id="min" type="button">minify</button><button class="btn -ghost" id="esc" type="button">escape</button><button class="btn -ghost" id="unesc" type="button">unescape</button><button class="btn -ghost" type="button" data-copy="#out">copy</button></div>
    <p class="err" id="err" role="alert"></p>
    <p class="hint" id="status" role="status"></p>
  </section>
  <section><label class="lbl" for="out">result</label><textarea class="field" id="out" readonly aria-live="polite"></textarea></section>
</main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
E.tool(function () {
  "use strict";

  /* ── core ──────────────────────────────────────────────────────────
     Pure: no DOM and no E. The site's MCP server (mcp-server.mjs) runs this
     block on its own, so an agent that never opens the page gets the same
     answers. AGENT_TOOLS is what the page and the server both offer. */

  /* Engine messages open with a capital ("Unexpected token…"); the site's
     errors are lowercase. A leading acronym such as JSON is left alone. */
  function quiet(message) {
    return /^[A-Z][a-z]/.test(message) ? message.charAt(0).toLowerCase() + message.slice(1) : message;
  }
  function formatJSON(source, indent) {
    // Validate without serializing the parsed values: JSON.stringify would
    // silently round large integers, normalize exponents, and lose duplicate keys.
    JSON.parse(source);
    var tokens = source.match(/"(?:[^"\\]|\\[\s\S])*"|true|false|null|-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?|[{}\[\],:]/g) || [];
    if (!indent) return tokens.join("");
    var parts = [], depth = 0, size = 0;
    function append(value) {
      size += value.length;
      if (size > 8 * 1024 * 1024) throw new Error("formatted output is too large; use minify or reduce the input");
      parts.push(value);
    }
    function line() { append("\n" + indent.repeat(depth)); }
    tokens.forEach(function (token, i) {
      if (token === "{" || token === "[") {
        append(token);
        if (++depth > 128) throw new Error("json is nested too deeply to format");
        if (tokens[i + 1] !== "}" && tokens[i + 1] !== "]") line();
      } else if (token === "}" || token === "]") {
        depth--;
        if (tokens[i - 1] !== "{" && tokens[i - 1] !== "[") line();
        append(token);
      } else if (token === ",") { append(token); line(); }
      else append(token === ":" ? ": " : token);
    });
    return parts.join("");
  }
  /**
   * One of the page's four modes over a text.
   * @param {"format"|"minify"|"escape"|"unescape"} mode
   * @param {string} text
   * @param {"2"|"4"|"tab"} [indent] For format.
   * @returns {string} The result.
   * @throws {Error} With the lowercase message the page shows.
   */
  function transform(mode, text, indent) {
    try {
      if (text.length > 2 * 1024 * 1024) throw new Error("keep json input under 2 million characters");
      if (mode === "escape") return JSON.stringify(text);
      if (mode === "unescape") {
        var parsed = JSON.parse(text);
        if (typeof parsed !== "string") throw new Error("unescape needs a json string enclosed in double quotes");
        return parsed;
      }
      return formatJSON(text, mode === "minify" ? "" : indent === "tab" ? "\t" : " ".repeat(indent === "4" ? 4 : 2));
    } catch (e) {
      throw new Error(quiet(e.message || "invalid json"));
    }
  }
  function text(value) { return String(value == null ? "" : value); }

  var AGENT_TOOLS = [{
    name: "format_json",
    title: "format or minify json",
    description: "Check that text is valid JSON and lay it out with 2 or 4 spaces or tabs, or minify it. " +
      "Numbers, key order and duplicate keys are kept exactly as written. Invalid JSON returns the parser's error.",
    input: {
      type: "object",
      properties: {
        json: { type: "string", description: "The JSON text." },
        indent: { type: "string", enum: ["2", "4", "tab", "minify"], default: "2", description: "Indentation, or minify for one line." }
      },
      required: ["json"]
    },
    readOnly: true,
    compute: function (args) {
      var indent = args.indent == null ? "2" : String(args.indent);
      if (["2", "4", "tab", "minify"].indexOf(indent) < 0) throw new Error("indent must be 2, 4, tab or minify");
      return { json: transform(indent === "minify" ? "minify" : "format", text(args.json), indent) };
    }
  }, {
    name: "escape_json_string",
    title: "escape text as a json string",
    description: "Turn text into a JSON string literal, quotes and escapes included, ready to paste into JSON or JavaScript.",
    input: { type: "object", properties: { text: { type: "string" } }, required: ["text"] },
    readOnly: true,
    compute: function (args) { return { json: transform("escape", text(args.text)) }; }
  }, {
    name: "unescape_json_string",
    title: "read a json string literal",
    description: "Turn a JSON string literal, in double quotes, back into the text it stands for.",
    input: { type: "object", properties: { json: { type: "string", description: "A JSON string, quotes included." } }, required: ["json"] },
    readOnly: true,
    compute: function (args) { return { text: transform("unescape", text(args.json)) }; }
  }];

  /* ── end core ────────────────────────────────────────────────────── */

  var input = E.qs("#in"), output = E.qs("#out"), error = E.qs("#err"), status = E.qs("#status");
  var mode = "format";
  var actions = [["#fmt", "format"], ["#min", "minify"], ["#esc", "escape"], ["#unesc", "unescape"]];
  function run() {
    actions.forEach(function (action) {
      var button = E.qs(action[0]), selected = mode === action[1];
      button.classList.toggle("-ghost", !selected);
      button.setAttribute("aria-pressed", String(selected));
    });
    if (!input.value.trim() && mode !== "escape") { output.value = ""; status.textContent = error.textContent = ""; return; }
    try {
      output.value = transform(mode, input.value, E.qs("#indent").value);
      error.textContent = "";
      status.textContent = mode === "unescape" ? "decoded string" : mode === "escape" ? "escaped as a json string" : "valid json";
    } catch (e) {
      output.value = "";
      status.textContent = "";
      error.textContent = e.message;
    }
  }
  actions.forEach(function (action) {
    E.on(E.qs(action[0]), "click", function () { mode = action[1]; run(); });
  });
  E.on(E.qs("#indent"), "change", function () { mode = "format"; run(); });
  E.on(input, "input", E.debounce(run, 120));
  input.value = E.param("t") || "";
  run();

  /* For agents in the browser: the core's tools, each shown in the page's
     own fields and mode so the visitor sees what was asked. */
  function show(next, value, indent) {
    mode = next;
    if (indent && indent !== "minify") E.qs("#indent").value = indent;
    input.value = text(value);
    run();
  }
  E.agentTools(AGENT_TOOLS, {
    format_json: function (args) {
      var result = AGENT_TOOLS[0].compute(args);
      show(args.indent === "minify" ? "minify" : "format", args.json, args.indent == null ? "2" : String(args.indent));
      return result;
    },
    escape_json_string: function (args) { show("escape", args.text); return AGENT_TOOLS[1].compute(args); },
    unescape_json_string: function (args) { show("unescape", args.json); return AGENT_TOOLS[2].compute(args); }
  });
});
</script>
</body>
</html>
