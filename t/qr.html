<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<style>
  #qr { display:grid; grid-template-columns:minmax(0,1fr); place-items:center; width:fit-content; max-width:100%; min-width:0; background:var(--color-qr-paper); }
  #qr:empty { display:none; }
  #qr img, #qr canvas { max-width:100%; height:auto; }
  .figure { overflow:auto; padding:0; background:transparent; }
</style>
<script src="../site.js"></script>
</head>
<body data-tool="qr">

<main class="stack-6">
  <section>
    <label class="lbl" for="in">text or link</label>
    <textarea class="field" id="in">https://example.com</textarea>
    <div class="grid2 mt-4"><div><label class="lbl" for="size">size</label><select class="field" id="size"><option>192</option><option selected>256</option><option>384</option><option>512</option></select></div><div><label class="lbl" for="level">error correction</label><select class="field" id="level"><option value="L">low</option><option value="M" selected>medium</option><option value="Q">quartile</option><option value="H">high</option></select></div></div>
    <p class="err" id="err" role="alert"></p>
  </section>
  <section>
    <figure class="figure"><div id="qr" role="img" aria-label="generated qr code"></div></figure>
    <div class="row mt-2"><button class="btn" id="dl" type="button" disabled>download png</button><button class="btn -ghost" id="dl-svg" type="button" disabled>download svg</button></div>
  </section>
</main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
E.tool(function () {
  "use strict";

  /* ── core ──────────────────────────────────────────────────────────
     Pure but for the encoder, which wants an element to draw into and gets
     a throwaway one. The site's MCP server (mcp-server.mjs) runs this block
     on its own, so an agent that never opens the page gets the same code.
     AGENT_TOOLS is what the page and the server both offer; media.js writes
     the PNG. */

  var LEVELS = { low: "L", medium: "M", quartile: "Q", high: "H" }, SIZES = [192, 256, 384, 512];

  /** The code's module grid, or an error in the page's words. */
  function qrModel(text, level) {
    try {
      return new QRCode(document.createElement("div"), { text: text, width: 256, height: 256, correctLevel: QRCode.CorrectLevel[level] })._oQRCode;
    } catch (e) { throw new Error("input is too long for this error-correction level"); }
  }

  /* The code sits inside a border one module wide, so it scales with the code.
     The whole image, border included, is the selected size; each edge is
     rounded to a whole pixel so modules stay crisp. */
  function qrSquares(model, size) {
    var count = model.getModuleCount(), span = count + 2, squares = [];
    var edge = function (k) { return Math.round(k * size / span); };
    for (var row = 0; row < count; row++) for (var col = 0; col < count; col++) {
      if (!model.isDark(row, col)) continue;
      var left = edge(col + 1), top = edge(row + 1);
      squares.push([left, top, edge(col + 2) - left, edge(row + 2) - top]);
    }
    return squares;
  }

  function qrSvg(squares, size, ink, paper) {
    var path = squares.map(function (q) { return "M" + q[0] + " " + q[1] + "h" + q[2] + "v" + q[3] + "h-" + q[2] + "z"; }).join("");
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="' + paper + '"/><path d="' + path + '" fill="' + ink + '"/></svg>';
  }

  /* The squares as pixels, black on white, for a PNG. */
  function qrPixels(squares, size) {
    var pixels = new Uint8Array(size * size * 4).fill(255);
    squares.forEach(function (q) {
      for (var y = q[1]; y < q[1] + q[3]; y++) for (var x = q[0]; x < q[0] + q[2]; x++) {
        var at = (y * size + x) * 4;
        pixels[at] = pixels[at + 1] = pixels[at + 2] = 0;
      }
    });
    return pixels;
  }

  var AGENT_TOOLS = [{
    name: "make_qr_code",
    title: "make a qr code",
    description: "Make a QR code for text or a link, black on white with a one-module border: a PNG image to show " +
      "or save, and the same code as SVG markup. Higher error correction survives more damage but holds less text.",
    input: {
      type: "object",
      properties: {
        text: { type: "string", minLength: 1, maxLength: 7089, description: "The text or link to encode." },
        size: { type: "integer", enum: SIZES, default: 256, description: "The image's width and height in pixels, border included." },
        errorCorrection: {
          type: "string", enum: ["low", "medium", "quartile", "high"], default: "medium",
          description: "How much of the code may be damaged and still scan: about 7%, 15%, 25% or 30%."
        }
      },
      required: ["text"],
      additionalProperties: false,
      examples: [{ text: "https://eyes.tools", size: 256, errorCorrection: "medium" }]
    },
    output: {
      type: "object",
      properties: {
        size: { type: "integer", description: "Pixels a side." },
        errorCorrection: { type: "string" },
        modules: { type: "integer", description: "The code's modules a side, border left out." },
        image: Media.FILE,
        svg: { type: "string", description: "The same code as SVG markup." }
      },
      required: ["size", "errorCorrection", "modules", "image", "svg"],
      additionalProperties: false
    },
    readOnly: true,
    compute: function (args) {
      var size = args.size == null ? 256 : Number(args.size), level = args.errorCorrection == null ? "medium" : String(args.errorCorrection);
      var text = String(args.text == null ? "" : args.text);
      if (SIZES.indexOf(size) < 0) throw new Error("size must be 192, 256, 384 or 512");
      if (!Object.prototype.hasOwnProperty.call(LEVELS, level)) throw new Error("error correction must be low, medium, quartile or high");
      if (!text) throw new Error("give some text to encode");
      var model = qrModel(text, LEVELS[level]), squares = qrSquares(model, size);
      return Media.png(qrPixels(squares, size), size, size).then(function (png) {
        return {
          size: size, errorCorrection: level, modules: model.getModuleCount(),
          image: Media.file("qr.png", "image/png", png), svg: qrSvg(squares, size, "#000000", "#ffffff")
        };
      });
    }
  }];

  /* ── end core ────────────────────────────────────────────────────── */

  var input = E.qs("#in"), host = E.qs("#qr"), error = E.qs("#err"), download = E.qs("#dl"), svgButton = E.qs("#dl-svg"), svgText = "", result = null;
  /* Resolve a colour token to #rrggbb by painting one pixel. The tokens are
     oklch, which many programs that open a downloaded svg cannot read. */
  function hexColor(color) {
    var probe = document.createElement("canvas").getContext("2d");
    probe.fillStyle = color; probe.fillRect(0, 0, 1, 1);
    var d = probe.getImageData(0, 0, 1, 1).data;
    return "#" + [d[0], d[1], d[2]].map(function (v) { return (v < 16 ? "0" : "") + v.toString(16); }).join("");
  }
  function run() {
    host.textContent = "";
    error.textContent = "";
    download.disabled = true;
    svgButton.disabled = true; svgText = ""; result = null;
    if (!input.value) return;
    var size = +E.qs("#size").value, squares;
    try { squares = qrSquares(qrModel(input.value, E.qs("#level").value), size); }
    catch (e) { error.textContent = e.message; return; }
    try {
      var style = getComputedStyle(document.documentElement), ink = hexColor(style.getPropertyValue("--color-qr-ink").trim()), paper = hexColor(style.getPropertyValue("--color-qr-paper").trim());
      var canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      var context = canvas.getContext("2d");
      if (!context) throw new Error("canvas");
      context.fillStyle = paper; context.fillRect(0, 0, size, size); context.fillStyle = ink;
      squares.forEach(function (q) { context.fillRect(q[0], q[1], q[2], q[3]); });
      svgText = qrSvg(squares, size, E.esc(ink), E.esc(paper));
      result = canvas; host.appendChild(canvas); download.disabled = false; svgButton.disabled = false;
    } catch (e) { error.textContent = "this browser could not draw the code"; }
  }
  E.on(input, "input", E.debounce(run, 160));
  E.on(E.qs("#size"), "change", run);
  E.on(E.qs("#level"), "change", run);
  E.on(download, "click", function () {
    var button = this;
    if (!result) return;
    button.disabled = true;
    result.toBlob(function (blob) {
      button.disabled = false;
      if (!blob) { error.textContent = "the browser could not create a png"; return; }
      E.download(blob, "qr.png", "image/png");
      E.flash(button, "downloaded");
    }, "image/png");
  });
  E.on(svgButton, "click", function () { if (svgText) { E.download(svgText, "qr.svg", "image/svg+xml"); E.flash(this, "downloaded"); } });
  var query = E.param("t");
  if (query) input.value = query;
  run();

  /* For agents in the browser: the code is drawn on the page, where it can
     be scanned or saved, and the agent gets the core's answer, as over MCP. */
  E.agentTools(AGENT_TOOLS, {
    make_qr_code: function (args) {
      var answer = AGENT_TOOLS[0].compute(args);
      E.qs("#size").value = String(args.size == null ? 256 : args.size);
      E.qs("#level").value = LEVELS[args.errorCorrection == null ? "medium" : String(args.errorCorrection)];
      input.value = String(args.text);
      run();
      return answer;
    }
  });
});
</script>
</body>
</html>
