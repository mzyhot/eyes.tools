<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<script src="../site.js"></script>
<script src="../theme.js"></script>
</head>
<body data-tool="coin">

<main class="stack-6">
  <section>
    <div class="seg" role="radiogroup" aria-label="randomness source">
      <label><input type="radio" name="src" value="prng"><span>prng</span></label>
      <label><input type="radio" name="src" value="trng"><span>trng</span></label>
      <label><input type="radio" name="src" value="csrng" checked><span>csrng</span></label>
    </div>
    <p class="hint" id="source-note" aria-live="polite"></p>
  </section>
  <section><label class="lbl" for="n">flips</label><input class="field" id="n" type="number" min="1" max="100" value="1" inputmode="numeric"></section>
  <section>
    <button class="btn" id="flip" type="button">flip</button>
    <p class="err" id="err" role="alert"></p>
    <div class="display mt-4" id="first" aria-live="polite"></div>
    <div class="out mt-2" id="all" aria-live="polite"></div>
    <p class="hint mt-2" id="counts" aria-live="polite"></p>
    <button class="btn -ghost mt-2" id="copy" type="button" disabled>copy results</button>
    <dl class="kv -stack mt-4" id="proof" hidden><dt>verification</dt><dd>signature verified</dd><dt>round</dt><dd id="round"></dd><dt>chain</dt><dd id="chain"></dd></dl>
  </section>
</main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
E.tool(function () {
  "use strict";

  /* ── core ──────────────────────────────────────────────────────────
     Pure but for R, the randomness sources the page's dependencies give it.
     The site's MCP server (mcp-server.mjs) runs this block on its own, after
     the same dependencies, so an agent that never opens the page gets the same
     flip. AGENT_TOOLS is what the page and the server both offer. */

  var SOURCES = ["csrng", "trng", "prng"];

  function flipCount(raw) {
    raw = String(raw).trim();
    var n = Number(raw);
    if (!/^\d+$/.test(raw) || !Number.isSafeInteger(n) || n < 1 || n > 100) {
      throw new Error("flips must be a whole number between 1 and 100");
    }
    return n;
  }

  /**
   * Flip n coins from one source, a bit of the draw each.
   * @returns {Promise<object>} The flips and their tally, and for a drand
   *   draw, what it takes to check it.
   */
  function flipCoins(n, source) {
    return R.source(source, R.byteCount(2, n)).then(function (draw) {
      var flips = [];
      for (var i = 0; i < n; i++) flips.push((draw.bytes[i >> 3] >> (i & 7) & 1) ? "heads" : "tails");
      var heads = flips.filter(function (value) { return value === "heads"; }).length;
      var result = { flips: flips, heads: heads, tails: n - heads, source: source, verified: !!draw.verified };
      if (draw.verified) { result.round = draw.round; result.chainHash = draw.chainHash; }
      return result;
    });
  }

  function sourceOf(args) {
    var source = args.source == null ? "csrng" : String(args.source);
    if (SOURCES.indexOf(source) < 0) throw new Error("source must be csrng, trng or prng");
    return source;
  }

  var AGENT_TOOLS = [{
    name: "flip_coins",
    title: "flip coins",
    description: "Flip up to 100 coins. The source is csrng (Web Crypto; the default), trng (a public " +
      "drand beacon whose signature is verified, so anyone can check the round later; needs the " +
      "network) or prng (Math.random, predictable).",
    input: {
      type: "object",
      properties: {
        count: { type: "integer", minimum: 1, maximum: 100, default: 1 },
        source: { type: "string", enum: SOURCES, default: "csrng" }
      }
    },
    readOnly: true,
    network: true,
    compute: function (args) {
      var source = sourceOf(args);
      return flipCoins(flipCount(args.count == null ? 1 : args.count), source);
    }
  }];

  /* ── end core ────────────────────────────────────────────────────── */

  var b = E.qs("#flip"), er = E.qs("#err"), first = E.qs("#first"), all = E.qs("#all"), proof = E.qs("#proof");
  var counts = E.qs("#counts"), copy = E.qs("#copy"), report = "", flipSeq = 0;
  /* The three sources rng offers, described the same way. */
  var NOTES = {
    prng: "Math.random() · predictable · not for security",
    trng: "fetches a public beacon from cloudflare drand and verifies its signature. your flip count stays in this browser.",
    csrng: "web crypto api · suitable for secrets"
  };
  function mode() {
    var selected = E.qsa("input[name=src]").filter(function (x) { return x.checked; })[0];
    return selected ? selected.value : "csrng";
  }
  function clear() {
    er.textContent = "";
    counts.textContent = report = "";
    copy.disabled = true;
    first.textContent = "";
    all.textContent = "";
    proof.hidden = true;
    E.qs("#round").textContent = "";
    E.qs("#chain").textContent = "";
  }
  /* A new source starts afresh: a flip still on its way from drand is
     dropped rather than shown under a different source's name. */
  function note() {
    flipSeq++;
    E.qs("#source-note").textContent = NOTES[mode()];
    clear();
    b.disabled = false;
    delete b.dataset.state;
  }
  E.on(copy, "click", function () { E.copy(report, this); });
  /* Flip as many coins as the field asks, drawing the result on the page.
     Resolves to the flips, or rejects with the message the page shows. */
  function flip() {
    var n, seq = ++flipSeq, source = mode();
    clear();
    try { n = flipCount(E.qs("#n").value); }
    catch (e) { er.textContent = e.message; return Promise.reject(e); }
    b.disabled = true;
    b.dataset.state = "loading";
    return flipCoins(n, source).then(function (result) {
      if (seq !== flipSeq) throw new Error("a newer flip replaced this one");
      first.textContent = result.flips[0];
      all.textContent = result.flips.join(" · ");
      counts.textContent = result.heads + " heads · " + result.tails + " tails";
      report = result.flips.join("\n") + "\n\n" + counts.textContent;
      copy.disabled = false;
      proof.hidden = !result.verified;
      if (result.verified) {
        E.qs("#round").textContent = result.round;
        E.qs("#chain").textContent = result.chainHash;
      }
      E.flash(b, "flipped");
      return result;
    }, function (e) {
      var message = (e && e.message) || "the randomness source failed";
      if (seq === flipSeq) er.textContent = message;
      throw new Error(message);
    }).finally(function () {
      if (seq !== flipSeq) return;
      b.disabled = false;
      delete b.dataset.state;
    });
  }
  E.qsa("input[name=src]").forEach(function (x) { E.on(x, "change", note); });
  E.on(b, "click", function () { flip().catch(function () {}); });
  note();

  /* For agents in the browser: the core's tool as a flip on the page, so the
     visitor sees the flips the agent was given. */
  E.agentTools(AGENT_TOOLS, {
    flip_coins: function (args) {
      var source = sourceOf(args);
      E.qs('input[name=src][value="' + source + '"]').checked = true;
      note();
      E.qs("#n").value = String(args.count == null ? 1 : args.count);
      return flip();
    }
  });
});
</script>
</body>
</html>
