<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<style>#canvas{display:block;width:100%;height:auto;background:var(--color-paper-2)}</style>
<script src="../site.js"></script>
</head>
<body data-tool="spectrogram">

<main class="stack-6">
  <section><label class="lbl" for="file">audio file</label><input class="field" id="file" type="file" accept="audio/*,.wav,.wave,.mp3,.m4a,.aac,.flac,.ogg,.oga,.opus,.webm"><p class="hint">typically wav, mp3, m4a/aac, flac, ogg/opus/vorbis, and webm · codec support depends on your browser</p><p class="err" id="err" role="alert"></p></section>
  <section><figure class="figure" id="frame" hidden><canvas id="canvas" width="960" height="480" role="img" aria-label="audio spectrogram"></canvas></figure><div class="row mt-2"><button class="btn" id="dl" type="button" disabled>download png</button><span class="hint" id="meta" aria-live="polite"></span></div></section>
</main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
/* Spectrogram: decode an audio file locally, run a short-time Fourier
   transform over it, and draw magnitude as brightness, time left to right,
   frequency bottom to top.

   Nothing leaves the browser. The file is read with the File API and decoded by
   the browser's own codecs through Web Audio.

   The work is heavy enough that how it is written decides whether the tool is
   usable, so three things are deliberate:

     · The transform is iterative and in place, and both the bit-reversal
       permutation and the twiddle factors depend only on N; they are built
       once at load and reused by every one of the ~960 × channels transforms a
       render performs, instead of calling Math.cos and Math.sin inside the
       innermost loop.
     · A column's frequency bands map to canvas rows the same way for every
       column, so that mapping is computed once per render rather than per pixel.
     · The picture is assembled in one pixel buffer and handed to the canvas
       in a single putImageData, rather than as ~460,000 one-pixel fillRect
       calls each preceded by a globalAlpha and fillStyle change. */
E.tool(function () {
  "use strict";

  /* ── core ──────────────────────────────────────────────────────────
     Pure: no DOM and no E, only media.js and the decoders in codecs/ it loads.
     The site's MCP server (mcp-server.mjs) runs this block on its own, so an
     agent that never opens the page gets a spectrogram drawn by the same code.
     The page decodes with the browser's own codecs, which read more formats;
     the server decodes wav itself and mp3, flac, vorbis and opus with the
     decoders. AGENT_TOOLS is what the page and the server both offer. */

  var N = 1024, HALF = N / 2;

  /* ── precomputed transform tables ─────────────────────────────────────
     REV[i] is i with its log2(N) bits reversed, the permutation the in-place
     transform starts from. COS/SIN hold one turn of the unit circle sampled N
     ways; a stage of length `len` reads them with a stride of N / len, which is
     the same angle the per-stage formula would have computed.               */

  var REV = new Uint16Array(N), COS = new Float64Array(HALF), SIN = new Float64Array(HALF);
  (function tables() {
    var bits = Math.round(Math.log(N) / Math.LN2), i, j, b;
    for (i = 0; i < N; i++) {
      j = 0;
      for (b = 0; b < bits; b++) if (i & (1 << b)) j |= 1 << (bits - 1 - b);
      REV[i] = j;
    }
    for (i = 0; i < HALF; i++) {
      COS[i] = Math.cos(-2 * Math.PI * i / N);
      SIN[i] = Math.sin(-2 * Math.PI * i / N);
    }
  })();

  /* Hann window, also fixed for a given N. */
  var WINDOW = new Float64Array(N);
  (function () {
    for (var i = 0; i < N; i++) WINDOW[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));
  })();

  /**
   * In-place radix-2 FFT of a complex signal of exactly N samples.
   * @param {Float64Array} re Real parts; replaced by the real spectrum.
   * @param {Float64Array} im Imaginary parts; replaced by the imaginary spectrum.
   */
  function fft(re, im) {
    var i, j, t, len, half, stride, p, k, q, u, angle, cs, sn, tr, ti;
    for (i = 0; i < N; i++) {
      j = REV[i];
      if (i < j) {
        t = re[i]; re[i] = re[j]; re[j] = t;
        t = im[i]; im[i] = im[j]; im[j] = t;
      }
    }
    for (len = 2; len <= N; len <<= 1) {
      half = len >> 1;
      stride = N / len;
      for (p = 0; p < N; p += len) {
        for (k = 0, angle = 0; k < half; k++, angle += stride) {
          cs = COS[angle]; sn = SIN[angle];
          u = p + k; q = u + half;
          tr = re[q] * cs - im[q] * sn;
          ti = re[q] * sn + im[q] * cs;
          re[q] = re[u] - tr; im[q] = im[u] - ti;
          re[u] += tr; im[u] += ti;
        }
      }
    }
  }

  /**
   * Draw a spectrogram into pixels: magnitude as ink over paper, time left to
   * right, frequency bottom to top.
   * @param {Float32Array[]} tracks Each channel's samples, all one length.
   * @param {number} width
   * @param {number} height
   * @param {number[]} paper [r, g, b] where it is silent.
   * @param {number[]} ink [r, g, b] where it is loudest.
   * @param {Uint8Array|Uint8ClampedArray} px width × height × 4 bytes, all written.
   */
  function paint(tracks, width, height, paper, ink, px) {
    var channelCount = tracks.length, length = tracks[0].length;
    var re = new Float64Array(N), im = new Float64Array(N), power = new Float64Array(HALF), y, bin;

    /* Which frequency bins each row covers. Identical for every column, so it
       is resolved once instead of once a column. */
    var bandLow = new Uint16Array(height), bandHigh = new Uint16Array(height);
    for (y = 0; y < height; y++) {
      bandLow[y] = Math.floor(y * HALF / height);
      bandHigh[y] = Math.min(HALF, Math.ceil((y + 1) * HALF / height));
    }

    /* Start at paper, then write only the pixels that carry signal. */
    for (var at = 0; at < px.length; at += 4) {
      px[at] = paper[0]; px[at + 1] = paper[1]; px[at + 2] = paper[2]; px[at + 3] = 255;
    }

    var perChannel = 1 / channelCount;
    var scale = 1 / (N / 4);
    var lastFrame = Math.max(0, length - N), span = Math.max(1, width - 1);

    for (var x = 0; x < width; x++) {
      var frame = Math.round(x / span * lastFrame);
      power.fill(0);
      for (var channel = 0; channel < channelCount; channel++) {
        var samples = tracks[channel], i;
        for (i = 0; i < N; i++) re[i] = (samples[frame + i] || 0) * WINDOW[i];
        im.fill(0);
        fft(re, im);
        for (bin = 0; bin < HALF; bin++) power[bin] += (re[bin] * re[bin] + im[bin] * im[bin]) * perChannel;
      }
      for (y = 0; y < height; y++) {
        var high = bandHigh[y], peak = 0;
        for (bin = bandLow[y]; bin < high; bin++) if (power[bin] > peak) peak = power[bin];
        var magnitude = Math.sqrt(peak) * scale;
        var alpha = (20 * Math.log10(magnitude + 1e-8) + 80) / 80;
        if (alpha <= 0.02) continue;
        if (alpha > 1) alpha = 1;
        /* Source-over of ink at this alpha onto paper, done arithmetically. */
        var offset = ((height - 1 - y) * width + x) * 4;
        px[offset] = paper[0] + (ink[0] - paper[0]) * alpha;
        px[offset + 1] = paper[1] + (ink[1] - paper[1]) * alpha;
        px[offset + 2] = paper[2] + (ink[2] - paper[2]) * alpha;
      }
    }
  }

  /* An agent's sound: 10 MB of file, and at most SAMPLE_LIMIT samples once
     decoded, all channels counted, about six minutes of cd stereo. */
  var AUDIO_CAP = 10 * 1024 * 1024, SAMPLE_LIMIT = 32000000;
  var TOO_LONG = "that sound is too long to draw here: up to about six minutes of stereo. the spectrogram page draws longer ones in a browser";
  var DECODERS = { "audio/mpeg": "mp3", "audio/flac": "flac", "audio/ogg": "vorbis", "audio/opus": "opus" };

  /* PCM or float wav, read here: the most common sound file needs no decoder. */
  function wav(bytes) {
    var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength), at = 12, format = null, data = null;
    while (at + 8 <= bytes.length) {
      var id = String.fromCharCode(bytes[at], bytes[at + 1], bytes[at + 2], bytes[at + 3]), size = view.getUint32(at + 4, true), body = at + 8;
      if (id === "fmt " && size >= 16) {
        format = { code: view.getUint16(body, true), channels: view.getUint16(body + 2, true), rate: view.getUint32(body + 4, true), bits: view.getUint16(body + 14, true) };
        if (format.code === 0xfffe && size >= 26) format.code = view.getUint16(body + 24, true);
      }
      if (id === "data") { data = { at: body, size: Math.min(size, bytes.length - body) }; break; }
      at = body + size + (size & 1);
    }
    if (!format || !data || !format.channels || !format.rate) throw new Error("that wav could not be read");
    var pcm = format.code === 1 && [8, 16, 24, 32].indexOf(format.bits) >= 0, float = format.code === 3 && (format.bits === 32 || format.bits === 64);
    if (!pcm && !float) throw new Error("that wav holds an encoding this does not read; send pcm or float wav, or mp3, flac, ogg or opus");
    var step = format.bits / 8, frames = Math.floor(data.size / (step * format.channels));
    if (frames * format.channels > SAMPLE_LIMIT) throw new Error(TOO_LONG);
    var channels = [], c, f;
    for (c = 0; c < format.channels; c++) channels.push(new Float32Array(frames));
    for (f = 0; f < frames; f++) {
      for (c = 0; c < format.channels; c++) {
        var o = data.at + (f * format.channels + c) * step, value;
        if (float) value = format.bits === 32 ? view.getFloat32(o, true) : view.getFloat64(o, true);
        else if (format.bits === 8) value = (bytes[o] - 128) / 128;
        else if (format.bits === 16) value = view.getInt16(o, true) / 32768;
        else if (format.bits === 24) value = ((bytes[o] | bytes[o + 1] << 8 | bytes[o + 2] << 16) << 8 >> 8) / 8388608;
        else value = view.getInt32(o, true) / 2147483648;
        channels[c][f] = value;
      }
    }
    return { channels: channels, sampleRate: format.rate };
  }

  function decodeAudio(bytes) {
    var type = Media.type(bytes);
    if (type === "audio/wav") return Promise.resolve().then(function () { return wav(bytes); });
    if (!DECODERS[type]) {
      throw new Error("send wav, mp3, flac, ogg vorbis or opus" + (type ? "; this is " + type : "") + ". the spectrogram page reads more, such as m4a and webm, in a browser");
    }
    return Media.codec(DECODERS[type]).then(function (codec) {
      return codec.decode(bytes, SAMPLE_LIMIT);
    }).catch(function (e) {
      throw new Error(e && e.name === "RangeError" ? TOO_LONG : "that " + DECODERS[type] + " file could not be decoded");
    });
  }

  /* The picture's facts, as the page writes them under it. */
  function facts(length, rate, channels, width, height) {
    return { duration: Math.round(length / rate * 1000) / 1000, sampleRate: rate, channels: channels, frequencyMax: rate / 2, width: width, height: height };
  }

  function spectrogram(args) {
    var width = args.width == null ? 960 : Number(args.width), height = args.height == null ? 480 : Number(args.height);
    var bytes = Media.bytes(args.audio, "audio", AUDIO_CAP);
    return decodeAudio(bytes).then(function (audio) {
      var length = audio.channels.length ? audio.channels[0].length : 0;
      if (!length || !audio.sampleRate) throw new Error("that sound has nothing in it to draw");
      var px = new Uint8Array(width * height * 4);
      paint(audio.channels, width, height, [0, 0, 0], [255, 255, 255], px);
      return Media.png(px, width, height).then(function (png) {
        var answer = facts(length, audio.sampleRate, audio.channels.length, width, height);
        answer.image = Media.file("spectrogram.png", "image/png", png);
        return answer;
      });
    });
  }

  var AGENT_TOOLS = [{
    name: "make_spectrogram",
    title: "draw a spectrogram",
    description: "Draw a sound's spectrogram: time left to right, frequency from 0 at the bottom to half the sample rate " +
      "at the top, louder as brighter (white on black, 80 dB of range). Returns the picture as a PNG image with the " +
      "sound's length, sample rate and channels. Send the sound as base64, up to 10 MB and about six minutes of stereo: " +
      "wav, mp3, flac, ogg vorbis or opus. On the spectrogram page, the browser reads more formats (m4a, aac, webm) and " +
      "the file the visitor chose is drawn when none is sent.",
    input: {
      type: "object",
      properties: {
        audio: {
          type: "string", contentEncoding: "base64", contentMediaType: "audio/*", maxLength: 14000000,
          description: "The sound, as base64 or a data: URL. On the spectrogram page, leave it out to use the file the visitor chose."
        },
        width: { type: "integer", minimum: 64, maximum: 2048, default: 960, description: "Pixels across: one column of the transform each." },
        height: { type: "integer", minimum: 64, maximum: 1024, default: 480, description: "Pixels from 0 Hz to the top frequency." }
      },
      required: ["audio"],
      additionalProperties: false,
      examples: [{ audio: "data:audio/wav;base64,UklGRiQCAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQACAAAAACUh4C4lIQAA294g0dveAAAlIeAuJSEAANveINHb3gAAJSHgLiUhAADb3iDR294AACUh4C4lIQAA294g0dveAAAlIeAuJSEAANveINHb3gAAJSHgLiUhAADb3iDR294AACUh4C4lIQAA294g0dveAAAlIeAuJSEAANveINHb3gAAJSHgLiUhAADb3iDR294AACUh4C4lIQAA294g0dveAAAlIeAuJSEAANveINHb3gAAJSHgLiUhAADb3iDR294AACUh4C4lIQAA294g0dveAAAlIeAuJSEAANveINHb3gAAJSHgLiUhAADb3iDR294AACUh4C4lIQAA294g0dveAAAlIeAuJSEAANveINHb3gAAJSHgLiUhAADb3iDR294AACUh4C4lIQAA294g0dveAAAlIeAuJSEAANveINHb3gAAJSHgLiUhAADb3iDR294AACUh4C4lIQAA294g0dveAAAlIeAuJSEAANveINHb3gAAJSHgLiUhAADb3iDR294AACUh4C4lIQAA294g0dveAAAlIeAuJSEAANveINHb3gAAJSHgLiUhAADb3iDR294AACUh4C4lIQAA294g0dveAAAlIeAuJSEAANveINHb3gAAJSHgLiUhAADb3iDR294AACUh4C4lIQAA294g0dveAAAlIeAuJSEAANveINHb3g==", width: 256, height: 128 }]
    },
    output: {
      type: "object",
      properties: {
        duration: { type: "number", description: "Seconds." },
        sampleRate: { type: "number", description: "Samples a second." },
        channels: { type: "integer" },
        frequencyMax: { type: "number", description: "The frequency at the top edge, in hertz: half the sample rate." },
        width: { type: "integer" },
        height: { type: "integer" },
        image: Media.FILE
      },
      required: ["duration", "sampleRate", "channels", "frequencyMax", "width", "height", "image"],
      additionalProperties: false
    },
    readOnly: true,
    compute: spectrogram
  }];

  /* ── end core ────────────────────────────────────────────────────── */

  var c = E.qs("#canvas"), figure = E.qs("#frame"), ctx = c.getContext("2d"), fileInput = E.qs("#file"), error = E.qs("#err"), meta = E.qs("#meta"), download = E.qs("#dl"), activeContext = null, filename = "spectrogram", loadSeq = 0, drawn = null, MAX_FILE = 150 * 1024 * 1024;

  /**
   * Resolve a CSS colour token to its opaque RGB channels, by painting it and
   * reading the pixel back. The design tokens are oklch, which no amount of
   * string parsing would turn into channel values.
   * @param {string} color Any colour the browser accepts.
   * @returns {number[]} [r, g, b], 0–255.
   */
  function rgb(color) {
    var probe = document.createElement("canvas");
    probe.width = 1; probe.height = 1;
    var pctx = probe.getContext("2d", { willReadFrequently: true });
    pctx.fillStyle = color;
    pctx.fillRect(0, 0, 1, 1);
    var data = pctx.getImageData(0, 0, 1, 1).data;
    return [data[0], data[1], data[2]];
  }

  function closeContext(ac) { if (!ac) return; try { var closing = ac.close(); if (closing && typeof closing.catch === "function") closing.catch(function () {}); } catch (e) {} }

  /* decodeAudioData has both a callback form and a promise form depending on
     the browser, and some implementations call back *and* resolve. Settle once. */
  function decode(ac, buffer) { return new Promise(function (resolve, reject) { var settled = false; function ok(value) { if (!settled) { settled = true; resolve(value); } } function bad(value) { if (!settled) { settled = true; reject(value); } } try { var pending = ac.decodeAudioData(buffer, ok, bad); if (pending && typeof pending.then === "function") pending.then(ok, bad); } catch (e) { bad(e); } }); }

  function clear() {
    error.textContent = "";
    meta.textContent = "";
    download.disabled = true;
    figure.hidden = true;
    drawn = null;
    if (!ctx) return;
    var paper = getComputedStyle(document.documentElement).getPropertyValue("--color-paper").trim();
    ctx.globalAlpha = 1;
    ctx.fillStyle = paper;
    ctx.fillRect(0, 0, c.width, c.height);
  }

  /**
   * Draw the whole spectrogram for a decoded buffer, in the page's colours.
   * @param {AudioBuffer} audio Decoded audio.
   */
  function draw(audio) {
    if (!ctx || !audio || !audio.numberOfChannels || !audio.length || !audio.sampleRate) return;
    var tracks = [], length = audio.length, rate = audio.sampleRate;
    for (var ch = 0; ch < audio.numberOfChannels; ch++) tracks.push(audio.getChannelData(ch));
    var style = getComputedStyle(document.documentElement);
    var image = ctx.createImageData(c.width, c.height);
    paint(tracks, c.width, c.height, rgb(style.getPropertyValue("--color-paper").trim()), rgb(style.getPropertyValue("--color-ink").trim()), image.data);
    ctx.globalAlpha = 1;
    ctx.putImageData(image, 0, 0);
    figure.hidden = false;
    drawn = facts(length, rate, tracks.length, c.width, c.height);

    meta.textContent = "time → 0–" + (length / rate).toFixed(2) + " s · frequency ↑ 0–" + Math.round(rate / 2).toLocaleString() + " hz · " + tracks.length + " channel" + (tracks.length === 1 ? "" : "s");
    c.setAttribute("aria-label", "audio spectrogram: time from 0 to " + (length / rate).toFixed(2) + " seconds, left to right, and frequency from 0 to " + Math.round(rate / 2).toLocaleString() + " hertz, bottom to top. brighter pixels are stronger frequencies.");
    download.disabled = false;
  }

  /* Each load gets a sequence number so a slow decode cannot draw over a file
     chosen after it, and the audio context is closed either way. */
  E.on(fileInput, "change", function () {
    var file = this.files && this.files[0], seq = ++loadSeq;
    closeContext(activeContext); activeContext = null; clear();
    if (!file) return;
    filename = file.name.replace(/\.[^.]*$/, "") || "audio";
    if (!file.size) { error.textContent = "that audio file is empty"; return; }
    if (file.size > MAX_FILE) { error.textContent = "files over 150 MB are not decoded to protect this tab's memory"; return; }
    var AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) { error.textContent = "the web audio api is unavailable in this browser"; return; }
    var ac;
    try { ac = new AudioContextClass(); activeContext = ac; } catch (e) { error.textContent = "an audio decoder could not be opened in this browser"; return; }
    meta.textContent = "reading audio…";
    file.arrayBuffer().then(function (buffer) { return decode(ac, buffer); }).then(function (audio) { if (seq === loadSeq) draw(audio); }).catch(function () { if (seq === loadSeq) { meta.textContent = ""; error.textContent = "this browser could not decode that audio codec or container"; } }).then(function () { closeContext(ac); if (activeContext === ac) activeContext = null; });
  });
  E.on(download, "click", function () {
    var button = this, name = filename, seq = loadSeq;
    if (button.disabled) return;
    button.disabled = true;
    c.toBlob(function (blob) { if (seq !== loadSeq) return; button.disabled = false; if (!blob) { error.textContent = "the browser could not create a png"; return; } E.download(blob, name + "-spectrogram.png", "image/png"); E.flash(button, "downloaded"); }, "image/png");
  });
  E.on(window, "pagehide", function () { loadSeq++; closeContext(activeContext); activeContext = null; });
  clear();

  /* For agents in the browser: a sound the agent sends goes in the page's file
     field, as if the visitor had chosen it, and the browser decodes and draws
     it; with none, the visitor's own is used. The agent gets the picture the
     download button gives, in the page's colours, with its facts. */
  function fromPage(args, signal) {
    if (args.width != null || args.height != null) {
      c.width = args.width == null ? 960 : Number(args.width);
      c.height = args.height == null ? 480 : Number(args.height);
    }
    if (args.audio != null) {
      var bytes = Media.bytes(args.audio, "audio", AUDIO_CAP);
      E.giveFile(fileInput, new File([bytes], "sound from the agent", { type: Media.type(bytes) || "" }));
    } else if (fileInput.files && fileInput.files[0]) {
      E.giveFile(fileInput, fileInput.files);
    } else {
      throw new Error("no sound is chosen on the page; send one as base64, or ask the visitor to choose or drop one");
    }
    var seq = loadSeq;
    return new Promise(function (resolve, reject) {
      (function wait() {
        if (signal && signal.aborted) { reject(new Error("cancelled")); return; }
        if (seq !== loadSeq) { reject(new Error("another file was chosen meanwhile")); return; }
        if (error.textContent) { reject(new Error(error.textContent)); return; }
        if (!drawn) { setTimeout(wait, 50); return; }
        c.toBlob(function (blob) {
          if (!blob) { reject(new Error("the browser could not create a png")); return; }
          blob.arrayBuffer().then(function (buffer) {
            var answer = Object.assign({}, drawn);
            answer.image = Media.file(filename + "-spectrogram.png", "image/png", new Uint8Array(buffer));
            resolve(answer);
          }, reject);
        }, "image/png");
      })();
    });
  }
  E.agentTools(AGENT_TOOLS, { make_spectrogram: fromPage }, ["audio"]);
});
</script>
</body>
</html>
