<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<script src="../site.js"></script>
</head>
<body data-tool="time">

<main class="stack-6">
  <section>
    <label class="lbl" for="in">date or unix timestamp</label>
    <input class="field" id="in" spellcheck="false" autocomplete="off" placeholder="2026-08-21T12:00:00Z or 1787313600">
    <div class="row mt-2"><button class="btn" id="now" type="button">use now</button></div>
    <p class="err" id="err" role="alert"></p>
  </section>
  <section>
    <label class="lbl" for="unit">timestamp unit</label>
    <select class="field" id="unit"><option value="auto">auto</option><option value="seconds">seconds</option><option value="milliseconds">milliseconds</option></select>
    <p class="hint mt-2" id="interpreted"></p>
  </section>
  <dl class="kv -stack" id="out" aria-live="polite"><dt>local</dt><dd></dd><dt>utc</dt><dd></dd><dt>iso 8601</dt><dd></dd><dt>unix seconds</dt><dd></dd><dt>unix milliseconds</dt><dd></dd></dl>
  <div class="row"><button class="btn -ghost" id="copy" type="button" disabled>copy</button></div>
</main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
E.tool(function () {
  "use strict";

  /* ── core ──────────────────────────────────────────────────────────
     Pure: no DOM and no E. The site's MCP server (mcp-server.mjs) runs this
     block on its own, so an agent that never opens the page gets the same
     answers. AGENT_TOOLS is what the page and the server both offer. */

  /**
   * Read a date or a unix timestamp.
   * @param {string} raw As typed.
   * @param {"auto"|"seconds"|"milliseconds"} unit How to read a bare number.
   * @returns {{date: Date, readAs: string|null}} readAs names the unit a bare
   *   number was taken in, and is null for a date.
   */
  function readTime(raw, unit) {
    var numeric = /^[+-]?\d+(?:\.\d+)?$/.test(raw);
    var calendar = /^(\d{4})-(\d{2})-(\d{2})(?:T|\s|$)/.exec(raw);
    if (calendar) {
      var check = new Date(0);
      check.setUTCFullYear(+calendar[1], +calendar[2] - 1, +calendar[3]);
      if (check.getUTCFullYear() !== +calendar[1] || check.getUTCMonth() !== +calendar[2] - 1 || check.getUTCDate() !== +calendar[3]) {
        throw new Error("that calendar date does not exist");
      }
    }
    var selected = unit;
    if (numeric && selected === "auto") selected = Math.abs(Number(raw)) < 1e11 ? "seconds" : "milliseconds";
    var date = numeric ? new Date(Number(raw) * (selected === "seconds" ? 1000 : 1)) : new Date(raw);
    if (!Number.isFinite(date.getTime())) throw new Error("date not understood or outside the supported range");
    return { date: date, readAs: numeric ? selected : null };
  }
  /* Every form but local time, which is whoever is reading's own. */
  function forms(date) {
    return { utc: date.toUTCString(), iso8601: date.toISOString(), unixSeconds: Math.floor(date.getTime() / 1000), unixMilliseconds: date.getTime() };
  }

  var AGENT_TOOLS = [{
    name: "convert_timestamp",
    title: "read a date or unix timestamp",
    description: "Turn a unix timestamp (seconds or milliseconds) or a date such as 2026-08-21T12:00:00Z " +
      "into UTC, ISO 8601 and both unix forms. Leave value out for the current moment.",
    input: {
      type: "object",
      properties: {
        value: { type: "string", description: "A date, or a unix timestamp in seconds or milliseconds." },
        unit: { type: "string", enum: ["auto", "seconds", "milliseconds"], default: "auto", description: "How to read a bare number; auto picks by size." }
      }
    },
    readOnly: true,
    compute: function (args) {
      var unit = args.unit == null ? "auto" : String(args.unit);
      if (["auto", "seconds", "milliseconds"].indexOf(unit) < 0) throw new Error("unit must be auto, seconds or milliseconds");
      var raw = args.value == null || args.value === "" ? new Date().toISOString() : String(args.value).trim();
      var read = readTime(raw, unit), result = forms(read.date);
      if (read.readAs) result.readAs = read.readAs;
      return result;
    }
  }];

  /* ── end core ────────────────────────────────────────────────────── */

  var input = E.qs("#in"), values = E.qsa("#out dd"), error = E.qs("#err");
  var unit = E.qs("#unit"), interpreted = E.qs("#interpreted"), copy = E.qs("#copy"), report = "";
  var labels = ["local", "utc", "iso 8601", "unix seconds", "unix milliseconds"];

  function run() {
    var raw = input.value.trim();
    values.forEach(function (value) { value.textContent = ""; });
    error.textContent = interpreted.textContent = report = "";
    copy.disabled = true;
    if (!raw) return;
    var read;
    try { read = readTime(raw, unit.value); }
    catch (e) { error.textContent = e.message; return; }
    if (read.readAs) interpreted.textContent = "read as " + read.readAs + (unit.value === "auto" ? " · choose a unit to override" : "");
    var f = forms(read.date);
    var results = [read.date.toLocaleString(), f.utc, f.iso8601, f.unixSeconds, f.unixMilliseconds];
    results.forEach(function (value, index) { values[index].textContent = value; });
    report = results.map(function (value, index) { return labels[index] + "  " + value; }).join("\n");
    copy.disabled = false;
  }
  E.on(input, "input", run);
  E.on(unit, "change", run);
  E.on(E.qs("#now"), "click", function () { input.value = new Date().toISOString(); run(); });
  E.on(copy, "click", function () { E.copy(report, this); });
  var query = E.param("t"), queryUnit = E.param("unit");
  input.value = query === null ? new Date().toISOString() : query;
  if (queryUnit === "seconds" || queryUnit === "milliseconds") unit.value = queryUnit;
  run();

  /* For agents in the browser: the core's tool on the page's own fields; here
     the reader is the visitor, so their local time comes back too. */
  E.agentTools(AGENT_TOOLS, {
    convert_timestamp: function (args) {
      var result = AGENT_TOOLS[0].compute(args);
      unit.value = args.unit == null ? "auto" : String(args.unit);
      input.value = args.value == null || args.value === "" ? result.iso8601 : String(args.value);
      run();
      return Object.assign({ local: new Date(result.unixMilliseconds).toLocaleString() }, result);
    }
  });
});
</script>
</body>
</html>
