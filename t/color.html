<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<style>
      /* The big swatch is the browser's own picker: choosing a color is one
         click on it. Its hex is written across it in whichever ink reads. */
      .picker { position: relative; }
      .picker input[type="color"] {
        display: block;
        width: 100%;
        height: calc(var(--space-16) * 3);
        padding: 0;
        border: var(--rule) solid var(--color-rule);
        border-radius: var(--radius);
        background: var(--color-paper);
        cursor: pointer;
        transition: border-color var(--dur-1) var(--ease-out);
      }
      .picker input[type="color"]:hover { border-color: var(--color-dim); }
      .picker input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
      .picker input[type="color"]::-webkit-color-swatch { border: 0; border-radius: var(--radius); }
      .picker input[type="color"]::-moz-color-swatch { border: 0; border-radius: var(--radius); }
      .picker__hex {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        font-size: var(--text-display);
        line-height: var(--lh-tight);
        color: var(--color-ink);
      }
      .picker[data-ink="dark"] .picker__hex { color: var(--color-paper); }
    </style>
<script src="../site.js"></script>
</head>
<body data-tool="color">

<main class="stack-6">
      <div class="picker" id="picker">
        <input type="color" id="pick" value="#1e90ff" aria-label="pick a color">
        <span class="picker__hex mono" id="swatch-hex" aria-hidden="true"></span>
      </div>
      <section>
        <label class="lbl" for="color">or type one</label>
        <input class="field" id="color" value="#1e90ff" placeholder="#1e90ff, rgb(30 144 255), tomato" autocomplete="off" spellcheck="false" aria-describedby="err">
      </section>
      <p class="err" id="err" role="alert"></p>
      <div id="readout" aria-live="polite"></div>
    </main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
      E.tool(function () {
        "use strict";

        /* ── core ────────────────────────────────────────────────────
           Pure: no DOM and no E. The site's MCP server (mcp-server.mjs)
           runs this block on its own, so an agent that never opens the page
           gets the same answers. AGENT_TOOLS is what both offer. */

        /* hex (three, four, six or eight digits), rgb() and hsl() are parsed
           here, exactly, so nothing is lost to a round trip through a canvas. */
        function parseExact(value) {
          value = String(value).trim().toLowerCase();
          var match = value.match(/^#?([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i);
          if (!match) {
            var functional = value.match(/^(rgb|hsl)\(([^()]+)\)$/);
            if (!functional) return null;
            var parts = functional[2].trim().split(/\s*,\s*|\s+/);
            if (parts.length !== 3 || parts.some(function (part) { return !/^[+-]?(?:\d+\.?\d*|\.\d+)(?:%|deg)?$/.test(part); })) return null;
            var values = parts.map(parseFloat);
            if (functional[1] === "rgb") {
              if (parts.some(function (part) { return /deg$/.test(part); })) return null;
              if (values.some(function (n, index) { return n < 0 || n > (/%$/.test(parts[index]) ? 100 : 255); })) return null;
              return values.map(function (n, index) { return Math.round(/%$/.test(parts[index]) ? n * 255 / 100 : n); });
            }
            if (/%$/.test(parts[0]) || !/%$/.test(parts[1]) || !/%$/.test(parts[2]) || values[1] < 0 || values[1] > 100 || values[2] < 0 || values[2] > 100) return null;
            var hue = ((values[0] % 360) + 360) % 360 / 30, saturation = values[1] / 100, lightness = values[2] / 100;
            var amplitude = saturation * Math.min(lightness, 1 - lightness);
            return [0, 8, 4].map(function (offset) { var k = (offset + hue) % 12; return Math.round((lightness - amplitude * Math.max(-1, Math.min(k - 3, 9 - k, 1))) * 255); });
          }
          var hex = match[1];
          if (hex.length <= 4) hex = hex.replace(/./g, function (c) { return c + c; });
          /* A see-through color is a different color on every background. */
          if (hex.length === 8 && hex.slice(6) !== "ff") return "translucent";
          return [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
        }

        /* The CSS named colors, so a name works wherever this runs. */
        var NAMED = {};
        ("aliceblue f0f8ff antiquewhite faebd7 aqua 00ffff aquamarine 7fffd4 azure f0ffff beige f5f5dc bisque ffe4c4 " +
         "black 000000 blanchedalmond ffebcd blue 0000ff blueviolet 8a2be2 brown a52a2a burlywood deb887 cadetblue 5f9ea0 " +
         "chartreuse 7fff00 chocolate d2691e coral ff7f50 cornflowerblue 6495ed cornsilk fff8dc crimson dc143c cyan 00ffff " +
         "darkblue 00008b darkcyan 008b8b darkgoldenrod b8860b darkgray a9a9a9 darkgreen 006400 darkgrey a9a9a9 " +
         "darkkhaki bdb76b darkmagenta 8b008b darkolivegreen 556b2f darkorange ff8c00 darkorchid 9932cc darkred 8b0000 " +
         "darksalmon e9967a darkseagreen 8fbc8f darkslateblue 483d8b darkslategray 2f4f4f darkslategrey 2f4f4f " +
         "darkturquoise 00ced1 darkviolet 9400d3 deeppink ff1493 deepskyblue 00bfff dimgray 696969 dimgrey 696969 " +
         "dodgerblue 1e90ff firebrick b22222 floralwhite fffaf0 forestgreen 228b22 fuchsia ff00ff gainsboro dcdcdc " +
         "ghostwhite f8f8ff gold ffd700 goldenrod daa520 gray 808080 green 008000 greenyellow adff2f grey 808080 " +
         "honeydew f0fff0 hotpink ff69b4 indianred cd5c5c indigo 4b0082 ivory fffff0 khaki f0e68c lavender e6e6fa " +
         "lavenderblush fff0f5 lawngreen 7cfc00 lemonchiffon fffacd lightblue add8e6 lightcoral f08080 lightcyan e0ffff " +
         "lightgoldenrodyellow fafad2 lightgray d3d3d3 lightgreen 90ee90 lightgrey d3d3d3 lightpink ffb6c1 " +
         "lightsalmon ffa07a lightseagreen 20b2aa lightskyblue 87cefa lightslategray 778899 lightslategrey 778899 " +
         "lightsteelblue b0c4de lightyellow ffffe0 lime 00ff00 limegreen 32cd32 linen faf0e6 magenta ff00ff maroon 800000 " +
         "mediumaquamarine 66cdaa mediumblue 0000cd mediumorchid ba55d3 mediumpurple 9370db mediumseagreen 3cb371 " +
         "mediumslateblue 7b68ee mediumspringgreen 00fa9a mediumturquoise 48d1cc mediumvioletred c71585 " +
         "midnightblue 191970 mintcream f5fffa mistyrose ffe4e1 moccasin ffe4b5 navajowhite ffdead navy 000080 " +
         "oldlace fdf5e6 olive 808000 olivedrab 6b8e23 orange ffa500 orangered ff4500 orchid da70d6 palegoldenrod eee8aa " +
         "palegreen 98fb98 paleturquoise afeeee palevioletred db7093 papayawhip ffefd5 peachpuff ffdab9 peru cd853f " +
         "pink ffc0cb plum dda0dd powderblue b0e0e6 purple 800080 rebeccapurple 663399 red ff0000 rosybrown bc8f8f " +
         "royalblue 4169e1 saddlebrown 8b4513 salmon fa8072 sandybrown f4a460 seagreen 2e8b57 seashell fff5ee " +
         "sienna a0522d silver c0c0c0 skyblue 87ceeb slateblue 6a5acd slategray 708090 slategrey 708090 snow fffafa " +
         "springgreen 00ff7f steelblue 4682b4 tan d2b48c teal 008080 thistle d8bfd8 tomato ff6347 turquoise 40e0d0 " +
         "violet ee82ee wheat f5deb3 white ffffff whitesmoke f5f5f5 yellow ffff00 yellowgreen 9acd32").split(" ").forEach(function (word, at, all) {
          if (at % 2 === 0) NAMED[word] = parseExact(all[at + 1]);
        });

        /* The page adds a reader for every other color the browser knows. */
        var parseMore = null;

        /** A color as [r, g, b], "translucent", or null for no color at all. */
        function parse(value) {
          var lower = String(value).trim().toLowerCase();
          if (lower === "transparent") return "translucent";
          return parseExact(lower) || (Object.prototype.hasOwnProperty.call(NAMED, lower) ? NAMED[lower] : null) || (parseMore ? parseMore(value) : null);
        }

        /* A number with at most `digits` decimals and no trailing zeros. */
        function trim(n, digits) { return String(Number(n.toFixed(digits))); }

        function cssHex(color) {
          return "#" + color.map(function (value) {
            return value.toString(16).padStart(2, "0");
          }).join("");
        }

        function rgb(color) { return "rgb(" + color.join(" ") + ")"; }

        function hsl(color) {
          var r = color[0] / 255;
          var g = color[1] / 255;
          var blue = color[2] / 255;
          var max = Math.max(r, g, blue);
          var min = Math.min(r, g, blue);
          var h = 0;
          var saturation = 0;
          var lightness = (max + min) / 2;
          var delta = max - min;

          if (delta) {
            saturation = delta / (1 - Math.abs(2 * lightness - 1));
            if (max === r) h = 60 * (((g - blue) / delta) % 6);
            else if (max === g) h = 60 * ((blue - r) / delta + 2);
            else h = 60 * ((r - g) / delta + 4);
          }
          return "hsl(" + Math.round((h + 360) % 360) + " " +
            Math.round(saturation * 100) + "% " + Math.round(lightness * 100) + "%)";
        }

        /* sRGB to OKLCH, by way of linear light and Björn Ottosson's OKLab. A
           grey has no hue, so it is written as 0. */
        function oklch(color) {
          var lin = color.map(function (value) {
            value /= 255;
            return value <= 0.04045 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
          });
          var l = Math.cbrt(0.4122214708 * lin[0] + 0.5363325363 * lin[1] + 0.0514459929 * lin[2]);
          var m = Math.cbrt(0.2119034982 * lin[0] + 0.6806995451 * lin[1] + 0.1073969566 * lin[2]);
          var s = Math.cbrt(0.0883024619 * lin[0] + 0.2817188376 * lin[1] + 0.6299787005 * lin[2]);
          var lightness = 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s;
          var a = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s;
          var b = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s;
          var chroma = Math.sqrt(a * a + b * b);
          var hue = chroma < 0.0001 ? 0 : (Math.atan2(b, a) * 180 / Math.PI + 360) % 360;
          /* Precise enough that a color read back from this comes within one step
             of where it started. */
          return "oklch(" + trim(lightness * 100, 2) + "% " + trim(chroma < 0.0001 ? 0 : chroma, 4) + " " + trim(hue, 2) + ")";
        }

        /* Why a value is not a usable color, in the page's words. */
        function problem(parsed) {
          if (parsed === "translucent") return "that color is see-through, so it changes with whatever is behind it. use an opaque one.";
          return "use hex, rgb(30 144 255), hsl(210 100% 56%), or a css color name";
        }

        /** One opaque color in every format the readout shows. */
        function describe(color) {
          return { hex: cssHex(color), rgb: rgb(color), hsl: hsl(color), oklch: oklch(color) };
        }

        var AGENT_TOOLS = [{
          name: "convert_color",
          title: "convert a color",
          description: "Give a color as hex, rgb, hsl and oklch, each ready to paste into CSS. Accepts opaque " +
            "hex, rgb(), hsl() and CSS color names such as rebeccapurple; the color page also reads oklch() " +
            "and every other CSS color.",
          input: {
            type: "object",
            properties: {
              color: { type: "string", description: "The color, such as #1e90ff, rgb(30 144 255) or tomato." }
            },
            required: ["color"]
          },
          readOnly: true,
          compute: function (args) {
            var color = parse(args.color == null ? "" : args.color);
            if (!Array.isArray(color)) throw new Error(problem(color));
            return describe(color);
          }
        }];

        /* ── end core ──────────────────────────────────────────────── */

        var field = E.qs("#color");
        var pick = E.qs("#pick");
        var picker = E.qs("#picker");
        var swatchHex = E.qs("#swatch-hex");
        var er = E.qs("#err");
        var readout = E.qs("#readout");

        /* Anything else the browser calls a color, such as hwb(), lab() or oklch(),
           is painted onto one pixel and read back as sRGB. Keywords that only
           mean something in a document are refused. */
        var probe = null;
        parseMore = function (value) {
          value = String(value).trim();
          if (!value || /^(?:currentcolor|inherit|initial|unset|revert|revert-layer)$/i.test(value)) return null;
          if (!window.CSS || !CSS.supports || !CSS.supports("color", value)) return null;
          if (!probe) {
            var canvas = document.createElement("canvas");
            canvas.width = canvas.height = 1;
            probe = canvas.getContext("2d", { willReadFrequently: true });
            if (!probe) return null;
          }
          probe.clearRect(0, 0, 1, 1);
          probe.fillStyle = "#000";
          probe.fillStyle = value;
          probe.fillRect(0, 0, 1, 1);
          var d = probe.getImageData(0, 0, 1, 1).data;
          return d[3] === 255 ? [d[0], d[1], d[2]] : "translucent";
        };

        /* Relative luminance, to pick the ink the hex is written in on the swatch. */
        function luminance(color) {
          return color.map(function (value) {
            value /= 255;
            return value <= 0.04045 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
          }).reduce(function (sum, value, index) {
            return sum + value * [0.2126, 0.7152, 0.0722][index];
          }, 0);
        }

        /* One result row: format, value, and its copy button. */
        var rows = {};
        ["hex", "rgb", "hsl", "oklch"].forEach(function (format) {
          var v = E.el("div", { class: "res__v mono", id: format });
          var button = E.el("button", { class: "tbtn", type: "button", id: "copy-" + format, text: "copy", "aria-label": "copy the " + format, disabled: true });
          E.on(button, "click", function () { E.copy(v.textContent, button); });
          readout.appendChild(E.el("div", { class: "res" }, [E.el("div", { class: "res__k", text: format }), v, button]));
          rows[format] = { v: v, button: button };
        });

        function show(format, text) {
          rows[format].v.textContent = text;
          rows[format].button.disabled = !text;
        }

        function run() {
          var color = parse(field.value);
          er.textContent = "";
          field.removeAttribute("aria-invalid");

          if (!Array.isArray(color)) {
            Object.keys(rows).forEach(function (format) { show(format, ""); });
            swatchHex.textContent = "";
            if (field.value.trim()) {
              field.setAttribute("aria-invalid", "true");
              er.textContent = problem(color);
            }
            return;
          }

          var result = describe(color);
          Object.keys(rows).forEach(function (format) { show(format, result[format]); });
          pick.value = result.hex;
          swatchHex.textContent = result.hex;
          /* Above this luminance black text reads better than white. */
          picker.dataset.ink = luminance(color) > 0.179 ? "dark" : "light";
        }

        E.on(field, "input", run);
        E.on(pick, "input", function () { field.value = pick.value; run(); });
        var query = E.param("t"); if (query !== null) field.value = query;
        run();

        /* For agents in the browser: the core's tool, with the color in the
           page's field where the visitor can see it. */
        E.agentTools(AGENT_TOOLS, {
          convert_color: function (args) {
            var result = AGENT_TOOLS[0].compute(args);
            field.value = String(args.color);
            run();
            return result;
          }
        });
      });
</script>
</body>
</html>
