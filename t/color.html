<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<style>
      /* a text field and the browser's own picker, side by side */
      .pick { display: flex; gap: var(--space-2); }
      .pick .field { flex: 1 1 auto; }
      .pick input[type="color"] {
        flex: 0 0 auto;
        width: var(--control-size);
        height: var(--control-size);
        padding: var(--space-1);
        border: var(--rule) solid var(--color-rule);
        border-radius: var(--radius);
        background: var(--color-paper);
        cursor: pointer;
        transition: border-color var(--dur-1) var(--ease-out);
      }
      .pick input[type="color"]:hover { border-color: var(--color-dim); }
      .pick input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
      .pick input[type="color"]::-webkit-color-swatch { border: 0; border-radius: var(--radius); }
      .pick input[type="color"]::-moz-color-swatch { border: 0; border-radius: var(--radius); }
      .swatch {
        display: grid;
        place-items: center;
        align-content: center;
        gap: var(--space-3);
        min-height: calc(var(--space-16) * 3);
        padding: var(--space-6);
        text-align: center;
        border: var(--rule) solid var(--color-rule);
        background: var(--swatch, var(--color-paper-2));
      }
      .swatch__big {
        font-size: var(--text-display);
        font-weight: 500;
        line-height: var(--lh-tight);
        letter-spacing: var(--track-tight);
      }
      .swatch__small { font-size: var(--text-base); line-height: var(--lh-snug); }
    </style>
<script src="../site.js"></script>
<script src="../theme.js"></script>
</head>
<body data-tool="color">

<main class="stack-6">
      <section class="grid2">
        <div>
          <label class="lbl" for="fg">foreground</label>
          <div class="pick">
            <input class="field" id="fg" value="#111111" autocomplete="off" spellcheck="false" aria-describedby="err">
            <input type="color" id="fg-pick" value="#111111" aria-label="pick the foreground color">
          </div>
        </div>
        <div>
          <label class="lbl" for="bg">background</label>
          <div class="pick">
            <input class="field" id="bg" value="#ffffff" autocomplete="off" spellcheck="false" aria-describedby="err">
            <input type="color" id="bg-pick" value="#ffffff" aria-label="pick the background color">
          </div>
        </div>
      </section>
      <div class="row">
        <button class="btn -ghost" id="swap" type="button">swap</button>
      </div>
      <p class="err" id="err" role="alert"></p>
      <div class="swatch" id="swatch" role="img" aria-label="color sample"></div>
      <div id="readout" aria-live="polite"></div>
    </main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
      E.tool(function () {
        "use strict";

        var f = E.qs("#fg");
        var b = E.qs("#bg");
        var fPick = E.qs("#fg-pick");
        var bPick = E.qs("#bg-pick");
        var er = E.qs("#err");
        var swatch = E.qs("#swatch");
        var readout = E.qs("#readout");

        /* hex, rgb() and hsl() are parsed here, exactly, so nothing is lost to
           a round trip through the browser. */
        function parseExact(value) {
          value = String(value).trim().toLowerCase();
          var match = value.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);
          if (!match) {
            var functional = value.match(/^(rgb|hsl)\(([^()]+)\)$/);
            if (!functional) return null;
            var parts = functional[2].trim().split(/\s*,\s*|\s+/);
            if (parts.length !== 3 || parts.some(function (part) { return !/^[+-]?(?:\d+\.?\d*|\.\d+)(?:%|deg)?$/.test(part); })) return null;
            var values = parts.map(parseFloat);
            if (functional[1] === "rgb") {
              if (parts.some(function (part) { return /deg$/.test(part); })) return null;
              if (values.some(function (n, index) { return n < 0 || n > (/%$/.test(parts[index]) ? 100 : 255); })) return null;
              return values.map(function (n, index) { return Math.round(/%$/.test(parts[index]) ? n * 255 / 100 : n); });
            }
            if (/%$/.test(parts[0]) || !/%$/.test(parts[1]) || !/%$/.test(parts[2]) || values[1] < 0 || values[1] > 100 || values[2] < 0 || values[2] > 100) return null;
            var hue = ((values[0] % 360) + 360) % 360 / 30, saturation = values[1] / 100, lightness = values[2] / 100;
            var amplitude = saturation * Math.min(lightness, 1 - lightness);
            return [0, 8, 4].map(function (offset) { var k = (offset + hue) % 12; return Math.round((lightness - amplitude * Math.max(-1, Math.min(k - 3, 9 - k, 1))) * 255); });
          }
          var hex = match[1];
          if (hex.length === 3) hex = hex.replace(/./g, function (c) { return c + c; });
          return [
            parseInt(hex.slice(0, 2), 16),
            parseInt(hex.slice(2, 4), 16),
            parseInt(hex.slice(4, 6), 16)
          ];
        }

        /* Anything else the browser calls a color — a name, hwb(), lab(),
           oklch(), four- and eight-digit hex — is painted onto one pixel and
           read back as sRGB. Keywords that only mean something in a document
           are refused, and so is anything see-through: it has no single
           contrast until you know what lies beneath it. */
        var probe = null;
        function parseCss(value) {
          value = String(value).trim();
          if (!value || /^(?:currentcolor|inherit|initial|unset|revert|revert-layer)$/i.test(value)) return null;
          if (!window.CSS || !CSS.supports || !CSS.supports("color", value)) return null;
          if (!probe) {
            var canvas = document.createElement("canvas");
            canvas.width = canvas.height = 1;
            probe = canvas.getContext("2d", { willReadFrequently: true });
            if (!probe) return null;
          }
          probe.clearRect(0, 0, 1, 1);
          probe.fillStyle = "#000";
          probe.fillStyle = value;
          probe.fillRect(0, 0, 1, 1);
          var d = probe.getImageData(0, 0, 1, 1).data;
          return d[3] === 255 ? [d[0], d[1], d[2]] : "translucent";
        }

        function parse(value) { return parseExact(value) || parseCss(value); }

        function cssHex(color) {
          return "#" + color.map(function (value) {
            return value.toString(16).padStart(2, "0");
          }).join("");
        }

        function rgb(color) { return "rgb(" + color.join(" ") + ")"; }

        function luminance(color) {
          return color.map(function (value) {
            value /= 255;
            return value <= 0.04045
              ? value / 12.92
              : Math.pow((value + 0.055) / 1.055, 2.4);
          }).reduce(function (sum, value, index) {
            return sum + value * [0.2126, 0.7152, 0.0722][index];
          }, 0);
        }

        function hsl(color) {
          var r = color[0] / 255;
          var g = color[1] / 255;
          var blue = color[2] / 255;
          var max = Math.max(r, g, blue);
          var min = Math.min(r, g, blue);
          var h = 0;
          var saturation = 0;
          var lightness = (max + min) / 2;
          var delta = max - min;

          if (delta) {
            saturation = delta / (1 - Math.abs(2 * lightness - 1));
            if (max === r) h = 60 * (((g - blue) / delta) % 6);
            else if (max === g) h = 60 * ((blue - r) / delta + 2);
            else h = 60 * ((r - g) / delta + 4);
          }
          return "hsl(" + Math.round((h + 360) % 360) + " " +
            Math.round(saturation * 100) + "% " + Math.round(lightness * 100) + "%)";
        }

        /* One result row: label, value, and its copy button. */
        function row(label, id, copyLabel, buttonId) {
          var v = E.el("div", { class: "res__v", id: id });
          var button = E.el("button", { class: "tbtn", type: "button", text: "copy", "aria-label": "copy " + copyLabel, disabled: true });
          if (buttonId) button.id = buttonId;
          E.on(button, "click", function () { E.copy(button.dataset.value || v.textContent, button); });
          readout.appendChild(E.el("div", { class: "res" }, [E.el("div", { class: "res__k", text: label }), v, button]));
          return { v: v, button: button };
        }

        var rows = {
          ratio: row("contrast", "ratio", "the contrast report", "copy-report"),
          hex: row("foreground hex", "hex", "the foreground hex"),
          rgb: row("foreground rgb", "rgb", "the foreground rgb"),
          hsl: row("foreground hsl", "hsl", "the foreground hsl"),
          bgHex: row("background hex", "bg-hex", "the background hex"),
          bgRgb: row("background rgb", "bg-rgb", "the background rgb"),
          bgHsl: row("background hsl", "bg-hsl", "the background hsl")
        };

        function show(key, text, copyText) {
          var r = rows[key];
          r.v.textContent = text;
          r.button.disabled = !text;
          if (copyText) r.button.dataset.value = copyText;
          else delete r.button.dataset.value;
        }

        function clearReadout() {
          Object.keys(rows).forEach(function (key) { show(key, ""); });
          swatch.removeAttribute("style");
          swatch.textContent = "";
          swatch.setAttribute("aria-label", "color sample");
        }

        function problem(field, name, value) {
          field.setAttribute("aria-invalid", "true");
          if (value === "translucent") return name + " is see-through, so its contrast depends on what is behind it. use an opaque color.";
          return name + ": use hex, rgb(255 0 0), hsl(0 100% 50%), or a css color name";
        }

        function run() {
          var foreground = parse(f.value);
          var background = parse(b.value);
          er.textContent = "";
          f.removeAttribute("aria-invalid");
          b.removeAttribute("aria-invalid");
          clearReadout();

          if (!Array.isArray(foreground) || !Array.isArray(background)) {
            var messages = [];
            if (f.value.trim() && !Array.isArray(foreground)) messages.push(problem(f, "foreground", foreground));
            if (b.value.trim() && !Array.isArray(background)) messages.push(problem(b, "background", background));
            er.textContent = messages.join(" · ");
            return;
          }

          fPick.value = cssHex(foreground);
          bPick.value = cssHex(background);

          var ratio = (Math.max(luminance(foreground), luminance(background)) + 0.05) /
            (Math.min(luminance(foreground), luminance(background)) + 0.05);
          var verdict = ratio >= 7
            ? "AAA text"
            : ratio >= 4.5
              ? "AA text"
              : ratio >= 3
                ? "AA large text only"
                : "fail";
          /* Rounded down, so a pair that only reaches 4.5 after rounding up is
             never shown as passing. */
          var shown = (Math.floor(ratio * 100) / 100).toFixed(2) + ":1";
          show("ratio", shown + " · " + verdict, cssHex(foreground) + " on " + cssHex(background) + " · " + shown + " · " + verdict);
          show("hex", cssHex(foreground));
          show("rgb", rgb(foreground));
          show("hsl", hsl(foreground));
          show("bgHex", cssHex(background));
          show("bgRgb", rgb(background));
          show("bgHsl", hsl(background));
          swatch.setAttribute(
            "style",
            "--swatch:" + cssHex(background) + ";color:" + cssHex(foreground)
          );
          swatch.setAttribute("aria-label", "sample text in " + cssHex(foreground) + " on " + cssHex(background));
          swatch.appendChild(E.el("span", { class: "swatch__big", text: "Aa" }));
          swatch.appendChild(E.el("span", { class: "swatch__small", text: "the quick brown fox jumps over the lazy dog" }));
        }

        E.on(f, "input", run);
        E.on(b, "input", run);
        E.on(fPick, "input", function () { f.value = fPick.value; run(); });
        E.on(bPick, "input", function () { b.value = bPick.value; run(); });
        E.on(E.qs("#swap"), "click", function () {
          var value = f.value;
          f.value = b.value;
          b.value = value;
          run();
        });
        var query = E.param("t"); if (query !== null) f.value = query;
        var backgroundQuery = E.param("bg"); if (backgroundQuery !== null) b.value = backgroundQuery;
        run();

        /* For agents: the pair is checked on the page, where the visitor can see it. */
        E.agentTool({
          name: "check_contrast",
          title: "check two colors' contrast",
          description: "Give the WCAG contrast ratio of a text color on a background and whether it passes " +
            "AA or AAA, with both colors as hex, rgb and hsl. Accepts any opaque CSS color: hex, rgb(), " +
            "hsl(), oklch(), names such as rebeccapurple. The pair is shown on the page.",
          input: {
            type: "object",
            properties: {
              foreground: { type: "string", description: "The text color." },
              background: { type: "string", description: "The color behind it." }
            },
            required: ["foreground", "background"]
          },
          readOnly: true,
          run: function (args) {
            f.value = String(args.foreground == null ? "" : args.foreground);
            b.value = String(args.background == null ? "" : args.background);
            run();
            if (er.textContent) throw new Error(er.textContent);
            var ratio = rows.ratio.v.textContent.split(" · ");
            return {
              ratio: ratio[0],
              wcag: ratio[1],
              foreground: { hex: rows.hex.v.textContent, rgb: rows.rgb.v.textContent, hsl: rows.hsl.v.textContent },
              background: { hex: rows.bgHex.v.textContent, rgb: rows.bgRgb.v.textContent, hsl: rows.bgHsl.v.textContent }
            };
          }
        });
      });
</script>
</body>
</html>
