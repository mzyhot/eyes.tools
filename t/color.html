<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<style>
      /* a text field and the browser's own picker, side by side */
      .pick { display: flex; gap: var(--space-2); }
      .pick .field { flex: 1 1 auto; }
      .pick input[type="color"] {
        flex: 0 0 auto;
        width: var(--control-size);
        height: var(--control-size);
        padding: var(--space-1);
        border: var(--rule) solid var(--color-rule);
        border-radius: var(--radius);
        background: var(--color-paper);
        cursor: pointer;
        transition: border-color var(--dur-1) var(--ease-out);
      }
      .pick input[type="color"]:hover { border-color: var(--color-dim); }
      .pick input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
      .pick input[type="color"]::-webkit-color-swatch { border: 0; border-radius: var(--radius); }
      .pick input[type="color"]::-moz-color-swatch { border: 0; border-radius: var(--radius); }
      .swatch {
        display: grid;
        place-items: center;
        align-content: center;
        gap: var(--space-3);
        min-height: calc(var(--space-16) * 3);
        padding: var(--space-6);
        text-align: center;
        border: var(--rule) solid var(--color-rule);
        background: var(--swatch, var(--color-paper-2));
      }
      .swatch__big {
        font-size: var(--text-display);
        font-weight: 500;
        line-height: var(--lh-tight);
        letter-spacing: var(--track-tight);
      }
      .swatch__small { font-size: var(--text-base); line-height: var(--lh-snug); }
    </style>
<script src="../site.js"></script>
</head>
<body data-tool="color">

<main class="stack-6">
      <section class="grid2">
        <div>
          <label class="lbl" for="fg">foreground</label>
          <div class="pick">
            <input class="field" id="fg" value="#111111" autocomplete="off" spellcheck="false" aria-describedby="err">
            <input type="color" id="fg-pick" value="#111111" aria-label="pick the foreground color">
          </div>
        </div>
        <div>
          <label class="lbl" for="bg">background</label>
          <div class="pick">
            <input class="field" id="bg" value="#ffffff" autocomplete="off" spellcheck="false" aria-describedby="err">
            <input type="color" id="bg-pick" value="#ffffff" aria-label="pick the background color">
          </div>
        </div>
      </section>
      <div class="row">
        <button class="btn -ghost" id="swap" type="button">swap</button>
      </div>
      <p class="err" id="err" role="alert"></p>
      <div class="swatch" id="swatch" role="img" aria-label="color sample"></div>
      <div id="readout" aria-live="polite"></div>
    </main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
      E.tool(function () {
        "use strict";

        /* ── core ────────────────────────────────────────────────────
           Pure: no DOM and no E. The site's MCP server (mcp-server.mjs)
           runs this block on its own, so an agent that never opens the page
           gets the same answers. AGENT_TOOLS is what both offer. */

        /* hex (three, four, six or eight digits), rgb() and hsl() are parsed
           here, exactly, so nothing is lost to a round trip through a canvas. */
        function parseExact(value) {
          value = String(value).trim().toLowerCase();
          var match = value.match(/^#?([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i);
          if (!match) {
            var functional = value.match(/^(rgb|hsl)\(([^()]+)\)$/);
            if (!functional) return null;
            var parts = functional[2].trim().split(/\s*,\s*|\s+/);
            if (parts.length !== 3 || parts.some(function (part) { return !/^[+-]?(?:\d+\.?\d*|\.\d+)(?:%|deg)?$/.test(part); })) return null;
            var values = parts.map(parseFloat);
            if (functional[1] === "rgb") {
              if (parts.some(function (part) { return /deg$/.test(part); })) return null;
              if (values.some(function (n, index) { return n < 0 || n > (/%$/.test(parts[index]) ? 100 : 255); })) return null;
              return values.map(function (n, index) { return Math.round(/%$/.test(parts[index]) ? n * 255 / 100 : n); });
            }
            if (/%$/.test(parts[0]) || !/%$/.test(parts[1]) || !/%$/.test(parts[2]) || values[1] < 0 || values[1] > 100 || values[2] < 0 || values[2] > 100) return null;
            var hue = ((values[0] % 360) + 360) % 360 / 30, saturation = values[1] / 100, lightness = values[2] / 100;
            var amplitude = saturation * Math.min(lightness, 1 - lightness);
            return [0, 8, 4].map(function (offset) { var k = (offset + hue) % 12; return Math.round((lightness - amplitude * Math.max(-1, Math.min(k - 3, 9 - k, 1))) * 255); });
          }
          var hex = match[1];
          if (hex.length <= 4) hex = hex.replace(/./g, function (c) { return c + c; });
          /* A see-through color has no single contrast until you know what
             lies beneath it. */
          if (hex.length === 8 && hex.slice(6) !== "ff") return "translucent";
          return [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
        }

        /* The CSS named colors, so a name works wherever this runs. */
        var NAMED = {};
        ("aliceblue f0f8ff antiquewhite faebd7 aqua 00ffff aquamarine 7fffd4 azure f0ffff beige f5f5dc bisque ffe4c4 " +
         "black 000000 blanchedalmond ffebcd blue 0000ff blueviolet 8a2be2 brown a52a2a burlywood deb887 cadetblue 5f9ea0 " +
         "chartreuse 7fff00 chocolate d2691e coral ff7f50 cornflowerblue 6495ed cornsilk fff8dc crimson dc143c cyan 00ffff " +
         "darkblue 00008b darkcyan 008b8b darkgoldenrod b8860b darkgray a9a9a9 darkgreen 006400 darkgrey a9a9a9 " +
         "darkkhaki bdb76b darkmagenta 8b008b darkolivegreen 556b2f darkorange ff8c00 darkorchid 9932cc darkred 8b0000 " +
         "darksalmon e9967a darkseagreen 8fbc8f darkslateblue 483d8b darkslategray 2f4f4f darkslategrey 2f4f4f " +
         "darkturquoise 00ced1 darkviolet 9400d3 deeppink ff1493 deepskyblue 00bfff dimgray 696969 dimgrey 696969 " +
         "dodgerblue 1e90ff firebrick b22222 floralwhite fffaf0 forestgreen 228b22 fuchsia ff00ff gainsboro dcdcdc " +
         "ghostwhite f8f8ff gold ffd700 goldenrod daa520 gray 808080 green 008000 greenyellow adff2f grey 808080 " +
         "honeydew f0fff0 hotpink ff69b4 indianred cd5c5c indigo 4b0082 ivory fffff0 khaki f0e68c lavender e6e6fa " +
         "lavenderblush fff0f5 lawngreen 7cfc00 lemonchiffon fffacd lightblue add8e6 lightcoral f08080 lightcyan e0ffff " +
         "lightgoldenrodyellow fafad2 lightgray d3d3d3 lightgreen 90ee90 lightgrey d3d3d3 lightpink ffb6c1 " +
         "lightsalmon ffa07a lightseagreen 20b2aa lightskyblue 87cefa lightslategray 778899 lightslategrey 778899 " +
         "lightsteelblue b0c4de lightyellow ffffe0 lime 00ff00 limegreen 32cd32 linen faf0e6 magenta ff00ff maroon 800000 " +
         "mediumaquamarine 66cdaa mediumblue 0000cd mediumorchid ba55d3 mediumpurple 9370db mediumseagreen 3cb371 " +
         "mediumslateblue 7b68ee mediumspringgreen 00fa9a mediumturquoise 48d1cc mediumvioletred c71585 " +
         "midnightblue 191970 mintcream f5fffa mistyrose ffe4e1 moccasin ffe4b5 navajowhite ffdead navy 000080 " +
         "oldlace fdf5e6 olive 808000 olivedrab 6b8e23 orange ffa500 orangered ff4500 orchid da70d6 palegoldenrod eee8aa " +
         "palegreen 98fb98 paleturquoise afeeee palevioletred db7093 papayawhip ffefd5 peachpuff ffdab9 peru cd853f " +
         "pink ffc0cb plum dda0dd powderblue b0e0e6 purple 800080 rebeccapurple 663399 red ff0000 rosybrown bc8f8f " +
         "royalblue 4169e1 saddlebrown 8b4513 salmon fa8072 sandybrown f4a460 seagreen 2e8b57 seashell fff5ee " +
         "sienna a0522d silver c0c0c0 skyblue 87ceeb slateblue 6a5acd slategray 708090 slategrey 708090 snow fffafa " +
         "springgreen 00ff7f steelblue 4682b4 tan d2b48c teal 008080 thistle d8bfd8 tomato ff6347 turquoise 40e0d0 " +
         "violet ee82ee wheat f5deb3 white ffffff whitesmoke f5f5f5 yellow ffff00 yellowgreen 9acd32").split(" ").forEach(function (word, at, all) {
          if (at % 2 === 0) NAMED[word] = parseExact(all[at + 1]);
        });

        /* The page adds a reader for every other color the browser knows. */
        var parseMore = null;

        /** A color as [r, g, b], "translucent", or null for no color at all. */
        function parse(value) {
          var lower = String(value).trim().toLowerCase();
          if (lower === "transparent") return "translucent";
          return parseExact(lower) || (Object.prototype.hasOwnProperty.call(NAMED, lower) ? NAMED[lower] : null) || (parseMore ? parseMore(value) : null);
        }

        function cssHex(color) {
          return "#" + color.map(function (value) {
            return value.toString(16).padStart(2, "0");
          }).join("");
        }

        function rgb(color) { return "rgb(" + color.join(" ") + ")"; }

        function luminance(color) {
          return color.map(function (value) {
            value /= 255;
            return value <= 0.04045
              ? value / 12.92
              : Math.pow((value + 0.055) / 1.055, 2.4);
          }).reduce(function (sum, value, index) {
            return sum + value * [0.2126, 0.7152, 0.0722][index];
          }, 0);
        }

        function hsl(color) {
          var r = color[0] / 255;
          var g = color[1] / 255;
          var blue = color[2] / 255;
          var max = Math.max(r, g, blue);
          var min = Math.min(r, g, blue);
          var h = 0;
          var saturation = 0;
          var lightness = (max + min) / 2;
          var delta = max - min;

          if (delta) {
            saturation = delta / (1 - Math.abs(2 * lightness - 1));
            if (max === r) h = 60 * (((g - blue) / delta) % 6);
            else if (max === g) h = 60 * ((blue - r) / delta + 2);
            else h = 60 * ((r - g) / delta + 4);
          }
          return "hsl(" + Math.round((h + 360) % 360) + " " +
            Math.round(saturation * 100) + "% " + Math.round(lightness * 100) + "%)";
        }

        /* Why a field's value is not a usable color, in the page's words. */
        function problem(name, parsed) {
          if (parsed === "translucent") return name + " is see-through, so its contrast depends on what is behind it. use an opaque color.";
          return name + ": use hex, rgb(255 0 0), hsl(0 100% 50%), or a css color name";
        }

        /** Everything the readout shows about a pair of opaque colors. */
        function compare(foreground, background) {
          var ratio = (Math.max(luminance(foreground), luminance(background)) + 0.05) /
            (Math.min(luminance(foreground), luminance(background)) + 0.05);
          var verdict = ratio >= 7 ? "AAA text" : ratio >= 4.5 ? "AA text" : ratio >= 3 ? "AA large text only" : "fail";
          /* Rounded down, so a pair that only reaches 4.5 after rounding up is
             never shown as passing. */
          var shown = (Math.floor(ratio * 100) / 100).toFixed(2) + ":1";
          return {
            ratio: shown,
            wcag: verdict,
            foreground: { hex: cssHex(foreground), rgb: rgb(foreground), hsl: hsl(foreground) },
            background: { hex: cssHex(background), rgb: rgb(background), hsl: hsl(background) }
          };
        }

        var AGENT_TOOLS = [{
          name: "check_contrast",
          title: "check two colors' contrast",
          description: "Give the WCAG contrast ratio of a text color on a background and whether it passes " +
            "AA or AAA, with both colors as hex, rgb and hsl. Accepts opaque hex, rgb(), hsl() and CSS " +
            "color names such as rebeccapurple; the color page also reads oklch() and every other CSS color.",
          input: {
            type: "object",
            properties: {
              foreground: { type: "string", description: "The text color." },
              background: { type: "string", description: "The color behind it." }
            },
            required: ["foreground", "background"]
          },
          readOnly: true,
          compute: function (args) {
            var fg = parse(args.foreground == null ? "" : args.foreground), bg = parse(args.background == null ? "" : args.background);
            var problems = [];
            if (!Array.isArray(fg)) problems.push(problem("foreground", fg));
            if (!Array.isArray(bg)) problems.push(problem("background", bg));
            if (problems.length) throw new Error(problems.join(" · "));
            return compare(fg, bg);
          }
        }];

        /* ── end core ──────────────────────────────────────────────── */

        var f = E.qs("#fg");
        var b = E.qs("#bg");
        var fPick = E.qs("#fg-pick");
        var bPick = E.qs("#bg-pick");
        var er = E.qs("#err");
        var swatch = E.qs("#swatch");
        var readout = E.qs("#readout");

        /* Anything else the browser calls a color, such as hwb(), lab() or oklch(),
           is painted onto one pixel and read back as sRGB. Keywords that only
           mean something in a document are refused. */
        var probe = null;
        parseMore = function (value) {
          value = String(value).trim();
          if (!value || /^(?:currentcolor|inherit|initial|unset|revert|revert-layer)$/i.test(value)) return null;
          if (!window.CSS || !CSS.supports || !CSS.supports("color", value)) return null;
          if (!probe) {
            var canvas = document.createElement("canvas");
            canvas.width = canvas.height = 1;
            probe = canvas.getContext("2d", { willReadFrequently: true });
            if (!probe) return null;
          }
          probe.clearRect(0, 0, 1, 1);
          probe.fillStyle = "#000";
          probe.fillStyle = value;
          probe.fillRect(0, 0, 1, 1);
          var d = probe.getImageData(0, 0, 1, 1).data;
          return d[3] === 255 ? [d[0], d[1], d[2]] : "translucent";
        };

        /* One result row: label, value, and its copy button. */
        function row(label, id, copyLabel, buttonId) {
          var v = E.el("div", { class: "res__v", id: id });
          var button = E.el("button", { class: "tbtn", type: "button", text: "copy", "aria-label": "copy " + copyLabel, disabled: true });
          if (buttonId) button.id = buttonId;
          E.on(button, "click", function () { E.copy(button.dataset.value || v.textContent, button); });
          readout.appendChild(E.el("div", { class: "res" }, [E.el("div", { class: "res__k", text: label }), v, button]));
          return { v: v, button: button };
        }

        var rows = {
          ratio: row("contrast", "ratio", "the contrast report", "copy-report"),
          hex: row("foreground hex", "hex", "the foreground hex"),
          rgb: row("foreground rgb", "rgb", "the foreground rgb"),
          hsl: row("foreground hsl", "hsl", "the foreground hsl"),
          bgHex: row("background hex", "bg-hex", "the background hex"),
          bgRgb: row("background rgb", "bg-rgb", "the background rgb"),
          bgHsl: row("background hsl", "bg-hsl", "the background hsl")
        };

        function show(key, text, copyText) {
          var r = rows[key];
          r.v.textContent = text;
          r.button.disabled = !text;
          if (copyText) r.button.dataset.value = copyText;
          else delete r.button.dataset.value;
        }

        function clearReadout() {
          Object.keys(rows).forEach(function (key) { show(key, ""); });
          swatch.removeAttribute("style");
          swatch.textContent = "";
          swatch.setAttribute("aria-label", "color sample");
        }

        function run() {
          var foreground = parse(f.value);
          var background = parse(b.value);
          er.textContent = "";
          f.removeAttribute("aria-invalid");
          b.removeAttribute("aria-invalid");
          clearReadout();

          if (!Array.isArray(foreground) || !Array.isArray(background)) {
            var messages = [];
            if (f.value.trim() && !Array.isArray(foreground)) { f.setAttribute("aria-invalid", "true"); messages.push(problem("foreground", foreground)); }
            if (b.value.trim() && !Array.isArray(background)) { b.setAttribute("aria-invalid", "true"); messages.push(problem("background", background)); }
            er.textContent = messages.join(" · ");
            return;
          }

          fPick.value = cssHex(foreground);
          bPick.value = cssHex(background);

          var result = compare(foreground, background);
          show("ratio", result.ratio + " · " + result.wcag, result.foreground.hex + " on " + result.background.hex + " · " + result.ratio + " · " + result.wcag);
          show("hex", result.foreground.hex);
          show("rgb", result.foreground.rgb);
          show("hsl", result.foreground.hsl);
          show("bgHex", result.background.hex);
          show("bgRgb", result.background.rgb);
          show("bgHsl", result.background.hsl);
          swatch.setAttribute(
            "style",
            "--swatch:" + result.background.hex + ";color:" + result.foreground.hex
          );
          swatch.setAttribute("aria-label", "sample text in " + result.foreground.hex + " on " + result.background.hex);
          swatch.appendChild(E.el("span", { class: "swatch__big", text: "Aa" }));
          swatch.appendChild(E.el("span", { class: "swatch__small", text: "the quick brown fox jumps over the lazy dog" }));
        }

        E.on(f, "input", run);
        E.on(b, "input", run);
        E.on(fPick, "input", function () { f.value = fPick.value; run(); });
        E.on(bPick, "input", function () { b.value = bPick.value; run(); });
        E.on(E.qs("#swap"), "click", function () {
          var value = f.value;
          f.value = b.value;
          b.value = value;
          run();
        });
        var query = E.param("t"); if (query !== null) f.value = query;
        var backgroundQuery = E.param("bg"); if (backgroundQuery !== null) b.value = backgroundQuery;
        run();

        /* For agents in the browser: the core's tool, with the pair in the
           page's fields where the visitor can see it. */
        E.agentTools(AGENT_TOOLS, {
          check_contrast: function (args) {
            var result = AGENT_TOOLS[0].compute(args);
            f.value = String(args.foreground);
            b.value = String(args.background);
            run();
            return result;
          }
        });
      });
</script>
</body>
</html>
