<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../s.css">
<style>
      #svg {
        width: 100%;
        min-width: 0;
        height: auto;
        background: var(--color-paper);
        color: var(--color-ink);
      }
      .figure { overflow: auto; }
    </style>
<script src="../site.js"></script>
</head>
<body data-tool="barcode">

<main class="stack-6">
      <section>
        <label class="lbl" for="in">ean-13 digits</label>
        <input class="field" id="in" type="text" inputmode="numeric" maxlength="32"
               value="590123412345" autocomplete="off" spellcheck="false">
        <p class="hint">enter 12 digits and the check digit is added, or all 13 if you have them. for a 12-digit upc-a code, put a 0 in front.</p>
        <p class="err" id="err" role="alert"></p>
      </section>

      <section>
        <figure class="figure">
          <svg id="svg" viewBox="0 0 226 106" role="img" aria-label="generated barcode"></svg>
        </figure>
        <div class="row mt-2">
          <button class="btn" id="dl" type="button" disabled>download svg</button>
          <button class="btn -ghost" id="png" type="button" disabled>download png</button>
          <button class="btn -ghost" id="copy" type="button" disabled>copy number</button>
        </div>
      </section>
    </main>

<script src="../tools.js"></script>
<script src="../s.js"></script>
<script>
      E.tool(function () {
        "use strict";

        /* ── core ────────────────────────────────────────────────────
           Pure: no DOM and no E. The site's MCP server (mcp-server.mjs)
           runs this block on its own, so an agent that never opens the page
           gets the same answers. AGENT_TOOLS is what both offer; media.js
           writes the PNG. */

        var LEFT = [
          "0001101", "0011001", "0010011", "0111101", "0100011",
          "0110001", "0101111", "0111011", "0110111", "0001011"
        ];
        var LEFT_G = [
          "0100111", "0110011", "0011011", "0100001", "0011101",
          "0111001", "0000101", "0010001", "0001001", "0010111"
        ];
        var RIGHT = [
          "1110010", "1100110", "1101100", "1000010", "1011100",
          "1001110", "1010000", "1000100", "1001000", "1110100"
        ];
        var PARITY = [
          "LLLLLL", "LLGLGG", "LLGGLG", "LLGGGL", "LGLLGG",
          "LGGLLG", "LGGGLL", "LGLGLG", "LGLGGL", "LGGLGL"
        ];

        function check(value) {
          var sum = 0;
          for (var index = 0; index < 12; index += 1) {
            sum += +value[index] * (index % 2 ? 3 : 1);
          }
          return String((10 - sum % 10) % 10);
        }

        /**
         * The thirteen digits a typed number stands for.
         * @returns {string} "" for empty input.
         * @throws {Error} With the message the page shows.
         */
        function ean13(raw) {
          var value = String(raw).trim().replace(/[\s-]/g, "");
          if (!value) return "";
          if (!/^\d+$/.test(value)) throw new Error("use digits, spaces or hyphens only");
          if (value.length === 12) value += check(value);
          if (value.length !== 13 || check(value) !== value[12]) throw new Error("enter 12 digits, or 13 with a valid check digit");
          return value;
        }

        /* Two units per module. EAN-13 asks for a quiet zone of 11 modules
           before the start guard and 7 after the end guard, so the 95 bars
           begin 22 units in and the 226-unit symbol ends 14 units after them. */
        var WIDTH = 226, HEIGHT = 106, SCALE = 2, LEFT_EDGE = 11 * SCALE;

        /**
         * Where everything goes: one bar per dark module, guard bars reaching
         * lower, and the digits the way EAN-13 lays them out: the first in the
         * quiet zone before the start guard, then six under each half, spread
         * to fill the space between the guards.
         */
        function layout(value) {
          var bits = "101", parity = PARITY[+value[0]], index, bars = [];
          for (index = 1; index <= 6; index += 1) bits += (parity[index - 1] === "L" ? LEFT : LEFT_G)[+value[index]];
          bits += "01010";
          for (index = 7; index < 13; index += 1) bits += RIGHT[+value[index]];
          bits += "101";
          for (index = 0; index < bits.length; index += 1) {
            if (bits[index] !== "1") continue;
            bars.push({ x: LEFT_EDGE + index * SCALE, height: index < 3 || (index >= 45 && index < 50) || index >= 92 ? 82 : 74 });
          }
          return {
            bars: bars,
            digits: [
              { text: value[0], x: LEFT_EDGE - 3, anchor: "end", length: 0 },
              { text: value.slice(1, 7), x: LEFT_EDGE + 3 * SCALE + 3, anchor: "start", length: 42 * SCALE - 6 },
              { text: value.slice(7), x: LEFT_EDGE + 50 * SCALE + 3, anchor: "start", length: 42 * SCALE - 6 }
            ]
          };
        }

        /* The barcode as a standalone svg, in the given colors and face. */
        function svgMarkup(value, ink, paper, font) {
          var parts = layout(value);
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + WIDTH + " " + HEIGHT + '" role="img" aria-label="ean-13 barcode for ' + value + '">' +
            '<rect width="' + WIDTH + '" height="' + HEIGHT + '" fill="' + paper + '"/>' +
            parts.bars.map(function (bar) { return '<rect x="' + bar.x + '" y="8" height="' + bar.height + '" width="' + SCALE + '" fill="' + ink + '"/>'; }).join("") +
            parts.digits.map(function (digit) {
              return '<text x="' + digit.x + '" y="98" text-anchor="' + digit.anchor + '"' + (digit.length ? ' textLength="' + digit.length + '"' : "") +
                ' font-family="' + font + '" font-size="14" fill="' + ink + '">' + digit.text + "</text>";
            }).join("") + "</svg>";
        }

        /* The digits for the PNG, five pixels by seven, one string per row:
           the image draws them, as the svg's text does, with no font to load. */
        var DIGITS = [
          ["01110", "10001", "10011", "10101", "11001", "10001", "01110"],
          ["00100", "01100", "00100", "00100", "00100", "00100", "01110"],
          ["01110", "10001", "00001", "00010", "00100", "01000", "11111"],
          ["11111", "00010", "00100", "00010", "00001", "10001", "01110"],
          ["00010", "00110", "01010", "10010", "11111", "00010", "00010"],
          ["11111", "10000", "11110", "00001", "00001", "10001", "01110"],
          ["00110", "01000", "10000", "11110", "10001", "10001", "01110"],
          ["11111", "00001", "00010", "00100", "01000", "01000", "01000"],
          ["01110", "10001", "10001", "01110", "10001", "10001", "01110"],
          ["01110", "10001", "10001", "01111", "00001", "00010", "01100"]
        ];
        /* Pixels per unit of the layout, and per dot of a digit. */
        var PNG_SCALE = 4, DOT = 6;

        /* The layout as black-on-white pixels: bars as the svg places them, each
           digit centred in the share of the line the svg's textLength gives it. */
        function pixels(value) {
          var parts = layout(value), width = WIDTH * PNG_SCALE, height = HEIGHT * PNG_SCALE;
          var px = new Uint8Array(width * height * 4).fill(255);
          function ink(x, y, w, h) {
            for (var row = y; row < y + h; row++) for (var col = x; col < x + w; col++) {
              var at = (row * width + col) * 4;
              px[at] = px[at + 1] = px[at + 2] = 0;
            }
          }
          parts.bars.forEach(function (bar) { ink(bar.x * PNG_SCALE, 8 * PNG_SCALE, SCALE * PNG_SCALE, bar.height * PNG_SCALE); });
          var glyphWidth = 5 * DOT, top = 98 * PNG_SCALE - 7 * DOT;
          parts.digits.forEach(function (digit) {
            var count = digit.text.length, advance = digit.length ? digit.length * PNG_SCALE / count : glyphWidth;
            var start = digit.anchor === "end" ? digit.x * PNG_SCALE - glyphWidth : digit.x * PNG_SCALE;
            for (var i = 0; i < count; i++) {
              var left = Math.round(start + i * advance + (advance - glyphWidth) / 2);
              DIGITS[+digit.text[i]].forEach(function (line, row) {
                for (var dot = 0; dot < 5; dot++) if (line[dot] === "1") ink(left + dot * DOT, top + row * DOT, DOT, DOT);
              });
            }
          });
          return { data: px, width: width, height: height };
        }

        var AGENT_TOOLS = [{
          name: "make_ean13_barcode",
          title: "make an ean-13 barcode",
          description: "Make an EAN-13 retail barcode from 12 digits (the check digit is added) or 13 (the " +
            "check digit is verified). For a 12-digit UPC-A code, put a 0 in front. Returns the number, the " +
            "barcode as a PNG image to show or print, and the same barcode as svg markup.",
          input: {
            type: "object",
            properties: { digits: { type: "string", minLength: 1, maxLength: 40, description: "12 or 13 digits; spaces and hyphens are ignored." } },
            required: ["digits"],
            additionalProperties: false,
            examples: [{ digits: "400638133393" }]
          },
          output: {
            type: "object",
            properties: {
              number: { type: "string", pattern: "^[0-9]{13}$", description: "All 13 digits, check digit last." },
              image: Media.FILE,
              svg: { type: "string", description: "The barcode as svg markup, drawn in a monospace font." }
            },
            required: ["number", "image", "svg"],
            additionalProperties: false
          },
          readOnly: true,
          compute: function (args) {
            var value = ean13(args.digits == null ? "" : args.digits);
            if (!value) throw new Error("give 12 or 13 digits");
            var drawn = pixels(value);
            return Media.png(drawn.data, drawn.width, drawn.height).then(function (png) {
              return { number: value, image: Media.file(value + ".png", "image/png", png), svg: svgMarkup(value, "#000000", "#ffffff", "monospace") };
            });
          }
        }];

        /* ── end core ──────────────────────────────────────────────── */

        var input = E.qs("#in");
        var svg = E.qs("#svg");
        var error = E.qs("#err");
        var download = E.qs("#dl");
        var copy = E.qs("#copy");
        var png = E.qs("#png");
        var number = "";

        /* Resolve a colour token to #rrggbb by painting one pixel. The tokens are
           oklch, which many programs that open a downloaded svg cannot read. */
        function hexColor(color) {
          var probe = document.createElement("canvas").getContext("2d");
          probe.fillStyle = color; probe.fillRect(0, 0, 1, 1);
          var d = probe.getImageData(0, 0, 1, 1).data;
          return "#" + [d[0], d[1], d[2]].map(function (v) { return (v < 16 ? "0" : "") + v.toString(16); }).join("");
        }

        function clear() {
          number = "";
          svg.textContent = "";
          svg.setAttribute("aria-label", "generated barcode");
          download.disabled = true;
          copy.disabled = true;
          png.disabled = true;
        }

        function run() {
          var value;
          clear();
          error.textContent = "";
          try { value = ean13(input.value); }
          catch (e) { error.textContent = e.message; return; }
          if (!value) return;

          number = value;
          svg.setAttribute("aria-label", "ean-13 barcode for " + value);
          download.disabled = false;
          copy.disabled = false;
          png.disabled = false;

          /* Scannable codes use the theme-independent QR tokens, read here so the
             exported svg carries literal values. */
          var namespace = "http://www.w3.org/2000/svg", parts = layout(value);
          var style = getComputedStyle(document.documentElement);
          var paper = hexColor(style.getPropertyValue("--color-qr-paper").trim());
          var ink = hexColor(style.getPropertyValue("--color-qr-ink").trim());
          var font = style.getPropertyValue("--font-mono").trim();
          var background = document.createElementNS(namespace, "rect");
          background.setAttribute("width", String(WIDTH));
          background.setAttribute("height", String(HEIGHT));
          background.setAttribute("fill", paper);
          svg.appendChild(background);
          parts.bars.forEach(function (bar) {
            var rect = document.createElementNS(namespace, "rect");
            rect.setAttribute("x", String(bar.x));
            rect.setAttribute("y", "8");
            rect.setAttribute("height", String(bar.height));
            rect.setAttribute("width", String(SCALE));
            rect.setAttribute("fill", ink);
            svg.appendChild(rect);
          });
          parts.digits.forEach(function (digit) {
            var label = document.createElementNS(namespace, "text");
            label.setAttribute("x", String(digit.x));
            label.setAttribute("y", "98");
            label.setAttribute("text-anchor", digit.anchor);
            if (digit.length) label.setAttribute("textLength", String(digit.length));
            label.setAttribute("font-family", font);
            label.setAttribute("font-size", "14");
            label.setAttribute("fill", ink);
            label.textContent = digit.text;
            svg.appendChild(label);
          });
        }

        E.on(input, "input", run);
        E.on(copy, "click", function () { E.copy(number, this); });
        E.on(download, "click", function () {
          if (!number) return;
          var data = new XMLSerializer().serializeToString(svg);
          E.download(data, "ean-13-" + number + ".svg", "image/svg+xml");
          E.flash(this, "downloaded");
        });
        E.on(png, "click", function () {
          if (!number) return;
          var button = this, currentNumber = number, image = new Image(), url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml" }));
          button.disabled = true;
          image.onload = function () {
            var canvas = document.createElement("canvas"); canvas.width = 904; canvas.height = 424;
            canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            canvas.toBlob(function (blob) { button.disabled = !number; if (!blob) { error.textContent = "the browser could not create a png"; return; } E.download(blob, "ean-13-" + currentNumber + ".png", "image/png"); E.flash(button, "downloaded"); }, "image/png");
          };
          image.onerror = function () { URL.revokeObjectURL(url); button.disabled = !number; error.textContent = "the browser could not create a png"; };
          image.src = url;
        });
        var query = E.param("t"); if (query !== null) input.value = query;
        run();

        /* For agents in the browser: the barcode is drawn on the page too, and
           the agent gets the core's answer, image and svg, as from /mcp. */
        E.agentTools(AGENT_TOOLS, {
          make_ean13_barcode: function (args) {
            var answer = AGENT_TOOLS[0].compute(args);
            input.value = String(args.digits);
            run();
            return answer;
          }
        });
      });
</script>
</body>
</html>
