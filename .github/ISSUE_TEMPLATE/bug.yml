name: Bug report
description: Something on the site does not work as it should.
labels: [bug]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The tool's address, for example https://eyes.tools/json
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Firefox 142 on macOS 26
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Where
      options:
        - https://eyes.tools
        - My own copy (Node server)
        - My own copy (Vercel or Cloudflare Pages)
        - Opened from disk
    validations:
      required: true
