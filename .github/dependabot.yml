# Weekly version updates, one grouped pull request per ecosystem.
version: 2
updates:
  # Playwright, the only npm package (a development dependency).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]

  # The desktop app's Rust crates. Its lockfile pins what Tauri allows.
  - package-ecosystem: "cargo"
    directory: "/desktop"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns: ["*"]

  # Actions are pinned to commits; this keeps the SHAs and their comments current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
