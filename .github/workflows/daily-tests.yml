name: daily tests

# Runs every check on main each night, so a floating Node release or a runner
# image change shows up on a day nothing is committed. GitHub may start a
# scheduled run late when its runners are busy.
on:
  schedule:
    # 1 am Central, following daylight saving time.
    - cron: '0 1 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/check.yml
