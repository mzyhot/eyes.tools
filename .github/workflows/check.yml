name: checks

# Runs on each push to main and each pull request, and daily on main so a
# floating Node release or a runner image change shows up without a commit.
on:
  push:
    branches: [main]
  pull_request:
  # 1 am Central, following daylight saving time.
  schedule:
    - cron: '0 1 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Install test browser
        if: matrix.node == 24
        run: npx playwright install --with-deps chromium
      - name: Exercise tools and WebRTC in Chromium
        if: matrix.node == 24
        env:
          SITE_TEST_URL: http://127.0.0.1:8880
          SHARE_TEST_URL: http://127.0.0.1:8880
        run: |
          node dev-server.mjs 8880 > /tmp/eyes-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8880/healthz; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/eyes-server.log; exit 1; fi
          npm run test:browser
      - name: Server diagnostics
        if: failure() && matrix.node == 24
        run: cat /tmp/eyes-server.log 2>/dev/null || true
