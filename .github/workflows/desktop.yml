name: desktop

# Builds the desktop app's installers on each platform's own runner: a
# universal .dmg for macOS, .msi and setup .exe for Windows, and .deb, .rpm and
# .AppImage for Linux. They are unsigned and attached to the run as artifacts,
# and to the GitHub release when the run is for a version tag.
# It runs when a push changes the app or this workflow, on any branch, and on a
# version tag; from the Actions tab once this file is on the default branch.
on:
  workflow_dispatch:
  push:
    # Branch pushes need the paths to match; a tag builds regardless.
    branches: ['**']
    tags: ['v*']
    paths: ['desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            bundles: desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            os: windows-latest
            args: ''
            bundles: |
              desktop/target/release/bundle/msi/*.msi
              desktop/target/release/bundle/nsis/*.exe
          - name: linux
            # The oldest supported runner, so the AppImage runs on older glibc.
            os: ubuntu-22.04
            args: ''
            bundles: |
              desktop/target/release/bundle/deb/*.deb
              desktop/target/release/bundle/rpm/*.rpm
              desktop/target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Add both Mac architectures
        if: matrix.name == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop
      # The CLI's npm package ships prebuilt binaries, pinned to the version
      # used locally, so no runner spends minutes compiling it. It refuses to
      # start without dist/, which build.rs fills, so the folder is made first.
      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p dist
          npx --yes @tauri-apps/cli@2.12.0 build ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eyes-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  # A version tag's installers go on its release, which is created with
  # generated notes if it does not exist yet. Only this job can write.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          find bundles -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
