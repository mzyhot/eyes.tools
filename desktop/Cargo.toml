[package]
name = "eyes"
version = "1.2.0"
description = "𓁹𓁹 as a desktop app"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Tauri's defaults less `dynamic-acl`, which keeps every permission manifest in
# the binary for capabilities granted at run time. The pages are granted none.
[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus"] }
# Opens outside links in the system browser, as Tauri's opener plugin does with
# this same crate, without the plugin's D-Bus and file manager code.
open = { version = "5", features = ["shellexecute-on-windows"] }

# WebKitGTK's settings, to switch on WebRTC for share. The version Tauri's
# webview already uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

# The pages are always embedded in the binary, so `cargo run` behaves exactly
# like a release build rather than waiting for a dev server that never starts.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
